/* ══════════ VISTA: UPLOAD + OCR AO VIVO ══════════ */
function viewUpload(v,id,vid){
  const k=id+'-'+vid;UPLOADS[k]={cfg:v,busy:false};
  const files=(v.files||[]).map((f,i)=>`<span class="dz-file" draggable="true" data-fi="${i}" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="upRun('${k}',${i})">${f.ico||'📄'} ${f.name}</span>`).join('');
  const rows=(v.fields||[]).map((f,i)=>`<div class="ocr-row" id="or-${k}-${i}"><span class="ocr-k">${f.k}</span><span style="text-align:right"><span class="ocr-v" id="ov-${k}-${i}">—</span></span></div>`).join('');
  return `<div class="vpane" data-view="${vid}"><div class="up-wrap">
    <div class="dropzone" id="dz-${k}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')"
         ondrop="event.preventDefault();this.classList.remove('over');upRun('${k}',+event.dataTransfer.getData('text/plain'))">
      <span class="dz-ico">${v.icon||'📥'}</span>
      <span class="dz-t">${v.title||'Arrasta um documento para aqui'}</span>
      <span class="dz-s">${v.sub||'ou clica num exemplo abaixo'}</span>
      <div class="dz-files">${files}</div>
      <div class="dz-bar" id="dzb-${k}"></div>
    </div>
    <div class="ocr">
      <div class="ocr-h"><span>${v.panelTitle||'Dados extraídos'}</span><span class="ocr-st" id="os-${k}">a aguardar documento</span></div>
      <div class="ocr-b">${rows}</div>
      <div class="ocr-f"><button class="dbtn primary" onclick="upApprove('${k}')">${v.action||'Aprovar e lançar'}</button><button class="dbtn" onclick="upReset('${k}')">Limpar</button></div>
    </div></div></div>`;
}
function upReset(k){
  const c=UPLOADS[k].cfg;
  (c.fields||[]).forEach((f,i)=>{const r=document.getElementById(`or-${k}-${i}`);r.className='ocr-row';document.getElementById(`ov-${k}-${i}`).textContent='—';});
  document.getElementById('os-'+k).textContent='a aguardar documento';
  document.getElementById('dzb-'+k).style.width='0';
  UPLOADS[k].busy=false;
}
function upRun(k,fi){
  const st=UPLOADS[k];if(st.busy)return;st.busy=true;
  const c=st.cfg,file=(c.files||[])[fi]||{};
  upReset(k);st.busy=true;
  const fields=c.fields||[];
  document.getElementById('os-'+k).textContent='a ler '+(file.name||'documento')+'…';
  const bar=document.getElementById('dzb-'+k);bar.style.width='0';
  setTimeout(()=>bar.style.width='100%',30);
  fields.forEach((f,i)=>{
    setTimeout(()=>{
      const val=(file.values&&file.values[i]!==undefined)?file.values[i]:(f.v||'—');
      const r=document.getElementById(`or-${k}-${i}`);
      document.getElementById(`ov-${k}-${i}`).textContent=val;
      r.className='ocr-row on hit';
      if(i===fields.length-1){
        document.getElementById('os-'+k).textContent='extraído · confiança '+(file.conf||'97%');
        st.busy=false;toast(k,'📄','<b>'+(file.name||'Documento')+'</b> lido e classificado');
      }
    },420*(i+1));
  });
}
function upApprove(k){

function viewFlowDiagram(v,id,vid){
  const k=id+'-'+vid;FLOWS[k]={cfg:v,step:-1};
  const nodes=v.nodes.map((n,i)=>
    (i?`<div class="farrow" id="fa-${k}-${i}"></div>`:'')+
    `<div class="fnode" id="fn-${k}-${i}" onclick="flowPick('${k}',${i})"><span class="fn-badge">✓</span><span class="fn-ico">${n.ico||'●'}</span><div class="fn-t">${n.t}</div><div class="fn-s">${n.s||''}</div></div>`
  ).join('');
  return `<div class="vpane" data-view="${vid}"><div class="fw">
    <div class="fw-canvas">${nodes}</div>
    <div class="fw-detail" id="fd-${k}"><h5>${v.hintTitle||'Clica num passo'}</h5><p>${v.hint||'Ou carrega em Executar para ver o processo a correr de ponta a ponta.'}</p></div>
    <div class="fw-bar"><button class="fw-btn" onclick="flowRun('${k}')">▶ Executar</button><div class="fw-prog"><span id="fp-${k}"></span></div></div>
  </div></div>`;
}
function flowPick(k,i){
  const n=FLOWS[k].cfg.nodes[i];
  document.querySelectorAll(`[id^="fn-${k}-"]`).forEach(el=>el.classList.remove('on'));
  document.getElementById(`fn-${k}-${i}`).classList.add('on');
  document.getElementById('fd-'+k).innerHTML=`<h5>${n.t}</h5><p>${n.detail||n.s||''}</p>`;
}
function flowRun(k){
  const st=FLOWS[k],ns=st.cfg.nodes;
  ns.forEach((_,i)=>{const el=document.getElementById(`fn-${k}-${i}`);el.classList.remove('done','on');const a=document.getElementById(`fa-${k}-${i}`);if(a)a.classList.remove('lit');});
  document.getElementById('fp-'+k).style.width='0';
  ns.forEach((n,i)=>setTimeout(()=>{
    const a=document.getElementById(`fa-${k}-${i}`);if(a)a.classList.add('lit');
    document.getElementById(`fn-${k}-${i}`).classList.add('done');
    document.getElementById('fp-'+k).style.width=Math.round((i+1)/ns.length*100)+'%';
    document.getElementById('fd-'+k).innerHTML=`<h5>${n.t}</h5><p>${n.detail||n.s||''}</p>`;
    if(i===ns.length-1)toast(k,'✓','<b>'+(st.cfg.done||'Processo concluído')+'</b>');
  },620*(i+1)));
}

/* ══════════ VISTA: CONFIGURADOR ══════════ */
function viewConfig(v,id,vid){

function cfgCalc(k){
  const v=CONFIGS[k].cfg;
  const vals=(v.sliders||[]).map((s,i)=>{

    document.getElementById(`cs-${k}-${i}`).textContent=String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(s.unit||'');

/* ══════════ TOASTS ══════════ */
function toast(k,ico,html){
  const app=document.querySelector(`[data-app="${String(k).split('-')[0]}"]`)||document.querySelector('.appwin');
  if(!app)return;
  let box=app.querySelector('.toasts');
  if(!box){box=document.createElement('div');box.className='toasts';app.querySelector('.appview').appendChild(box);}
  const el=document.createElement('div');el.className='toast';el.innerHTML=`<i>${ico}</i><span>${html}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},2900);
}


/* ══════════ CASOS DE ESTUDO ══════════ */
const CASE_META={}, CASE_SRC={};
function caseHtml(k){
  const c=CASE_SRC[k]||{};
  if(c.html)return c.html;
  if(c.b64){try{return decodeURIComponent(escape(atob(c.b64)));}catch(e){return atob(c.b64);}}
  return '<div style="font:15px/1.6 -apple-system,sans-serif;padding:56px;color:#7A7A9A">Caso de estudo não carregado.</div>';
}
function elCases(b){
  const cards=b.cases.map(c=>{
    CASE_META[c.key]={t:c.t,s:c.s||''};
    CASE_SRC[c.key]={html:c.html,b64:c.b64,url:c.url};
    return `<div class="cscard" onclick="openCase('${c.key}')">
      <div class="csprev"><iframe data-case="${c.key}" scrolling="no" tabindex="-1"></iframe>
        <span class="csveil"></span><span class="csopen">abrir caso de estudo &rarr;</span></div>
      <div class="csmeta"><span class="cs-n">${c.n||''}</span><span class="cs-t">${c.t}</span>
        <span class="cs-p">${c.p||''}</span>
        ${(c.tags||[]).length?`<span class="cstags">${c.tags.map(x=>`<span class="cstag">${x}</span>`).join('')}</span>`:''}
      </div></div>`;}).join('');
  return `<div class="slide"><div class="wide">
    <div class="tc-center">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2>
    ${b.sub?`<p class="sbody" style="margin:0 auto">${b.sub}</p>`:''}</div>
    <div class="csgrid">${cards}</div></div></div>`;
}
function mountCasePreviews(){
  document.querySelectorAll('.csprev iframe').forEach(f=>{
    const wrap=f.parentNode,w=wrap.clientWidth||480,s=w/1440;
    f.style.transform='scale('+s+')';
    f.style.height=(wrap.clientHeight/s)+'px';
    const c=CASE_SRC[f.dataset.case]||{};
    if(c.url)f.src=c.url; else f.srcdoc=caseHtml(f.dataset.case);
  });
}
function openCase(k){
  const ov=document.getElementById('csov'),fr=document.getElementById('csframe');
  document.getElementById('csb-t').textContent=(CASE_META[k]&&CASE_META[k].s)?'· '+CASE_META[k].s:'';
  const c=CASE_SRC[k]||{};
  if(c.url)fr.src=c.url; else fr.srcdoc=caseHtml(k);
  ov.classList.add('on');
}
function closeCase(){
  const ov=document.getElementById('csov');
  if(!ov||!ov.classList.contains('on'))return false;
  ov.classList.remove('on');
  setTimeout(()=>{const f=document.getElementById('csframe');f.srcdoc='';f.removeAttribute('src');},320);
  return true;
}
window.addEventListener('resize',()=>{clearTimeout(window.__csr);window.__csr=setTimeout(mountCasePreviews,220);});

/* ══════════ VISTAS: PIPELINE · MAIL · TREE ══════════ */
const PIPE={}, MAILS={}, TREES={};
function viewPipeline(v,id,vid){
  const k=id+'-'+vid;PIPE[k]={cfg:v,i:0,running:false};
  const nodes=v.stages.map((s,i)=>`<div class="plnode${i===0?' on':''}" onclick="plGo('${k}',${i})">
      <span class="pldot">${s.ico||'•'}</span><span class="plk">${(i<9?'0':'')+(i+1)}</span>
      <span class="pll">${s.t}</span></div>`).join('');
  return `<div class="vpane" data-view="${vid}">
    <div class="plhead"><span class="plsub">${v.sub||''}</span>
      <button class="plrun" id="plr-${k}" onclick="plRun('${k}')">${v.runLabel||'▶ correr o ciclo'}</button></div>
    <div class="plrail" id="pr-${k}"><span class="plfill" id="pf-${k}"></span>${nodes}</div>
    <div class="pldet" id="pd-${k}"></div></div>`;
}
function plPaint(k){
  const st=PIPE[k],v=st.cfg,rail=document.getElementById('pr-'+k);if(!rail)return;
  rail.querySelectorAll('.plnode').forEach((n,i)=>{n.classList.toggle('on',i===st.i);n.classList.toggle('done',i<st.i);});
  const N=v.stages.length;
  document.getElementById('pf-'+k).style.width=(N>1?(st.i/(N-1))*84:0)+'%';
  const s=v.stages[st.i],d=s.detail||{};
  const meta=(d.meta||[]).map(m=>`<div><span>${m.k}</span><b>${m.v}</b></div>`).join('');
  document.getElementById('pd-'+k).innerHTML=
    `<div class="pld-h"><span class="pld-t">${d.title||s.t}</span>${d.tag?`<span class="pld-tag${d.key?' key':''}">${d.tag}</span>`:''}</div>
     ${meta?`<div class="pld-m">${meta}</div>`:''}${d.note?`<div class="pld-n">${d.note}</div>`:''}`;
}
function plGo(k,i){const st=PIPE[k];if(st.running)return;st.i=i;plPaint(k);}
function plRun(k){
  const st=PIPE[k],btn=document.getElementById('plr-'+k);
  if(st.running)return;st.running=true;btn.disabled=true;st.i=0;plPaint(k);
  let n=1;
  const tick=()=>{if(n>=st.cfg.stages.length){st.running=false;btn.disabled=false;return;}
    st.i=n++;plPaint(k);setTimeout(tick,1050);};
  setTimeout(tick,750);
}
function viewMail(v,id,vid){
  const k=id+'-'+vid;MAILS[k]={cfg:v,sent:false};
  const body=(v.body||[]).map(x=>`<p>${x}</p>`).join('');
  const why=(v.reasoning||[]).map(r=>`<div class="mlwi">${r}</div>`).join('');
  return `<div class="vpane" data-view="${vid}"><div class="mlwrap">
      <div class="mlcard">
        <div class="mlhead">
          <div class="mlrow"><i>de</i><span>${v.from||''}</span></div>
          <div class="mlrow"><i>para</i><span>${v.to||''}</span></div>
          <div class="mlsub">${v.subject||''}</div></div>
        <div class="mlbody" id="mb-${k}">${body}</div>
        <div class="mlfoot" id="mf-${k}">
          <button class="mlbtn pri" onclick="mlSend('${k}')">Aprovar e enviar</button>

          <button class="mlbtn" onclick="mlReject('${k}')">Rejeitar</button></div>
      </div>

function mlSend(k){

  document.getElementById('mf-'+k).innerHTML='<span class="mlsent">✓ enviado · registado no histórico do cliente</span>';

function mlReject(k){
  document.getElementById('mf-'+k).innerHTML='<span class="mlsent" style="color:#8A5D12">✕ rejeitado · nada foi enviado ao cliente</span>';
}
function viewTree(v,id,vid){
  const k=id+'-'+vid;TREES[k]={cfg:v,sel:0};
  const rows=v.nodes.map((n,i)=>`<div class="trn${n.hit?' hit':''}${n.flag?' flag':''}${n.kids?' open':''}"
      style="padding-left:${9+(n.d||0)*17}px" data-i="${i}" onclick="trPick('${k}',${i},event)">
      <span class="trc">${n.kids?'›':''}</span><span class="tri">${n.ico||'▢'}</span>
      <span class="trl">${n.l}</span>${n.b?`<span class="trb">${n.b}</span>`:''}</div>`).join('');
  const chips=(v.routes||[]).map((r,i)=>`<span class="trchip${i===0?' on':''}" onclick="trRoute('${k}',${i},this)">${r.label}</span>`).join('');
  return `<div class="vpane" data-view="${vid}"><div class="trwrap">
      <div class="trbox" id="tb2-${k}">${rows}</div>
      <div class="trside">${chips?`<h5>${v.routesTitle||'Encaminhamento'}</h5><div class="trchips">${chips}</div>`:''}
        <div id="ts-${k}"></div></div></div></div>`;
}
function trSide(k,r){
  document.getElementById('ts-'+k).innerHTML=
    `<div style="display:flex;flex-direction:column;gap:9px"><span class="trt">${r.t}</span>
      ${r.path?`<span class="trp">${r.path}</span>`:''}${r.d?`<span class="trd">${r.d}</span>`:''}</div>`;
}
function trRoute(k,i,el){
  const st=TREES[k],r=st.cfg.routes[i];
  el.parentNode.querySelectorAll('.trchip').forEach(c=>c.classList.remove('on'));el.classList.add('on');
  const box=document.getElementById('tb2-'+k);
  box.querySelectorAll('.trn').forEach(n=>{n.classList.remove('hit');n.classList.remove('flag');});
  (r.hit||[]).forEach(ix=>{const n=box.querySelector('.trn[data-i="'+ix+'"]');if(n)n.classList.add(r.warn?'flag':'hit');});
  trSide(k,r);
}
function trPick(k,i,ev){
  ev.stopPropagation();
  const st=TREES[k],n=st.cfg.nodes[i];
  if(n.info)trSide(k,n.info);
  const el=document.querySelector('#tb2-'+k+' .trn[data-i="'+i+'"]');
  if(n.kids&&el){
    el.classList.toggle('open');
    const hide=!el.classList.contains('open');
    for(let j=i+1;j<st.cfg.nodes.length;j++){
      if((st.cfg.nodes[j].d||0)<=(n.d||0))break;
      const e2=document.querySelector('#tb2-'+k+' .trn[data-i="'+j+'"]');
      if(e2)e2.style.display=hide?'none':'flex';
    }
  }
}

      </div>
    </div></div></div>`;
}

function elCards(b,id){
  MODULES[id]=b.cards;
  const cards=b.cards.map((c,i)=>`<div class="mc" onclick="openModule(${id},${i})"><span class="mc-n">${c.n||''}</span><span class="mc-ico">${c.ico||''}</span>${c.tag?`<div class="mc-tag">${c.tag}</div>`:''}<div class="mc-t">${c.t}</div><div class="mc-d">${c.d||''}</div>${c.long?'<div class="mc-more">ver detalhe →</div>':''}</div>`).join('');
  return `<div class="slide"><div class="wide"><div class="tc-center">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml||''}</h2></div><div class="mgrid">${cards}</div></div></div>`;}

/* GARANTIAS — slide obrigatório em todos os decks */
function elGuarantees(b){
  const cards=b.cards.map(c=>`<div class="guarc"><span class="guar-i">${c.ico||'✦'}</span><h4>${c.t}</h4><p>${c.p}</p></div>`).join('');
  return `<div class="slide"><div class="wide"><div class="tc-center">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2></div><div class="guargrid">${cards}</div></div></div>`;}

function elPrice(b){
  if(b.mode==='phased'){
    const rows=b.rows.map(r=>`<tr><td style="width:90px"><span class="ptag">${r.tag||''}</span></td><td><span class="ptd-t">${r.title}</span><span class="ptd-s">${r.desc||''}</span></td><td class="ptd-v">${r.value}</td></tr>`).join('');
    return `<div class="slide"><div class="wide">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2>
      <table class="ptable"><thead><tr><th>Fase</th><th>Âmbito</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows}</tbody></table>
      ${b.total?`<div class="ptotal"><div><div class="pt-l">${b.totalLabel||'Total'}</div><div class="pt-v">${b.total}</div></div><div class="pt-s">${b.totalSub||''}</div></div>`:''}
      ${b.note?`<div class="inote">${b.note}</div>`:''}</div></div>`;}
  const items=(b.items||[]).map(i=>`<div class="ii"><span class="ic2">✓</span>${i}</div>`).join('');
  return `<div class="slide">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2>
    <div class="iw"><div class="ib"><div class="price">${b.price}</div><div class="psub">${b.priceSub||''}</div>
      ${items?`<div class="ig">${items}</div>`:''}${b.guarantee?`<div class="guar">${b.guarantee}</div>`:''}</div>
      ${b.note?`<div class="inote">${b.note}</div>`:''}</div></div>`;}

function elSteps(b){
  const steps=b.steps.map(s=>`<div class="stc"><div class="stn">${s.n}</div><h4>${s.h}</h4><p>${s.p}</p></div>`).join('');
  const c=b.contact;
  const contact=c?`<div class="contactbox"><div><h3>${c.title||'Pronto para avançar?'}</h3><p>${c.text||''}</p></div>
    <div class="cright"><b>${c.name||''}</b><span>${c.email||''}</span></div></div>`:'';
  return `<div class="slide"><div class="wide">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2><div class="steps">${steps}</div>${contact}${b.validity?`<div class="validity">${b.validity}</div>`:''}</div></div>`;}


/* CONSULTORIA — visão geral das fases (gantt) */
function elPhases(b){
  const total=b.bars.reduce((s,x)=>s+(x.span||1),0);
  const weeks=b.weeks.map(w=>`<span>${w}</span>`).join('');
  const bars=b.bars.map(x=>`<div class="ph-bar ${x.cls||'p1'}" style="grid-column:span ${x.span||1}"><h4>${x.title}</h4><span>${x.sub||''}</span></div>`).join('');
  const leg=(b.legend||[]).map(l=>`<span><i class="${l.cls}"></i>${l.label}</span>`).join('');
  return `<div class="slide"><div class="wide">
    <div class="tc-center">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2>${b.sub?`<p class="sbody" style="margin:0 auto">${b.sub}</p>`:''}</div>
    <div class="ph">
      <div class="ph-weeks" style="grid-template-columns:repeat(${b.weeks.length},1fr)">${weeks}</div>
      <div class="ph-rule"></div>
      <div class="ph-bars" style="grid-template-columns:repeat(${total},1fr)">${bars}</div>
      ${leg?`<div class="ph-legend">${leg}</div>`:''}
    </div></div></div>`;}

/* CONSULTORIA — timeline de marcos de uma fase */
function elTimeline(b){
  const bands=(b.bands||[]).map(x=>`<div class="tl-band" style="flex:${x.span||1}">${x.label}</div>`).join('');
  const cols=b.items.map(it=>{
    const pos=it.pos||'up';
    const cls=(it.highlight?' hl':'')+(it.mark?' mark':'');
    return `<div class="tl-col">
      <div class="tl-card ${pos}${cls}"><h4>${it.t}</h4><p>${it.p||''}</p></div>
      <div class="tl-stem ${pos}"></div><div class="tl-dot"></div></div>`;}).join('');
  return `<div class="slide"><div class="wide">
    <div class="tc-center">${b.label?`<p class="slbl">${b.label}</p>`:''}<h2 class="stitle">${b.titleHtml}</h2>${b.sub?`<p class="sbody" style="margin:0 auto">${b.sub}</p>`:''}</div>
    <div class="tl c-${b.theme||'p1'}">
      ${bands?`<div class="tl-bands">${bands}</div>`:''}
      <div class="tl-track" style="grid-template-columns:repeat(${b.items.length},1fr)">
        <div class="tl-line"></div>${cols}
      </div></div></div></div>`;}

const RENDER={cover:elCover,ask:elAsk,problems:elProblems,app:elApp,phases:elPhases,timeline:elTimeline,guarantees:elGuarantees,price:elPrice,steps:elSteps,cases:elCases,needs:elNeeds,pains:elPains};
/* ═══ RENDERERS ADICIONAIS · "Porquê a GM Flow" ═══
   Acrescentados a pedido: dois blocos tipográficos (qlist, proof).
   Não alteram nenhum renderer nem widget já existente do motor.        */
function elQList(b,id){
  const rows=(b.rows||[]).map((r,i)=>`
    <div class="qrow" id="qr-${id}-${i}" onclick="qlToggle('${id}',${i})">
      <div class="qr-head">
        <span class="qr-n">${r.n||''}</span>
        <div class="qr-body">
          <h3 class="qr-q">${r.q||''}</h3>
          <p class="qr-a">${r.a||''}</p>
          <div class="qr-exp"><div class="qr-expi">
            ${r.detail?`<p class="qr-d">${r.detail}</p>`:''}
            ${r.points?`<ul class="qr-pts">${r.points.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}
          </div></div>
        </div>
        <span class="qr-more"></span>
      </div>
    </div>`).join('');
  return `<div class="slide"><div class="wide"><div class="tc-center">
    ${b.label?`<p class="slbl">${b.label}</p>`:''}
    <h2 class="stitle">${b.titleHtml||''}</h2>
    ${b.intro?`<p class="sbody" style="margin:0 auto">${b.intro}</p>`:''}
    </div><div class="qlist" id="ql-${id}">${rows}</div></div></div>`;
}
function qlToggle(id,i){
  const wrap=document.getElementById('ql-'+id);
  const row=document.getElementById('qr-'+id+'-'+i);
  if(!wrap||!row)return;
  const wasOpen=row.classList.contains('on');
  wrap.querySelectorAll('.qrow').forEach(r=>r.classList.remove('on'));
  if(wasOpen){wrap.classList.remove('has-open');}
  else{row.classList.add('on');wrap.classList.add('has-open');}
}
function elProof(b,id){
  const L=b.left||{},R=b.right||{};
  const chips=(L.chips||[]).map(c=>`<span class="pf-chip">${c}</span>`).join('');
  const stats=(L.stats||[]).map(s=>`<div><span class="pf-sv">${s.v}</span><span class="pf-sl">${s.l}</span></div>`).join('');
  const log=(R.log||[]).map((x,i)=>`<div class="pf-li"><span class="pf-ln">${String(i+1).padStart(2,'0')}</span>
      <div class="pf-lc"><span class="pf-lt">${x.t}</span><span class="pf-ld">${x.d||''}</span></div></div>`).join('');
  return `<div class="slide"><div class="wide"><div class="tc-center">
    ${b.label?`<p class="slbl">${b.label}</p>`:''}
    <h2 class="stitle">${b.titleHtml||''}</h2></div>
    <div class="pfgrid">
      <div class="pf-left">
        <span class="pf-name">${L.name||''}</span><span class="pf-role">${L.role||''}</span>
        ${chips?`<div class="pf-chips">${chips}</div>`:''}
        ${L.text?`<p class="pf-text">${L.text}</p>`:''}
        ${stats?`<div class="pf-stats">${stats}</div>`:''}
        ${L.foot?`<p class="pf-foot">${L.foot}</p>`:''}
      </div>
      <div class="pf-right">
        <h3 class="pf-rt">${R.title||''}</h3>
        ${R.sub?`<p class="pf-rs">${R.sub}</p>`:''}
        ${log?`<div class="pf-log">${log}</div>`:''}
        ${R.close?`<p class="pf-close">${R.close}</p>`:''}

RENDER.qlist=elQList; RENDER.proof=elProof;


function mountLogos(){
  const slot=document.getElementById('clientLogoSlot');const m=DECK.meta||{};
  slot.innerHTML=`<span class="clientname">${m.client||''}</span>`;
  if(m.clientLogo){
    const img=new Image();img.alt=m.client||'';
    img.onload=()=>{slot.innerHTML='';slot.appendChild(img);};
    img.src=m.clientLogo;
  }
}

function build(){
  document.documentElement.style.setProperty('--accent',(DECK.theme&&DECK.theme.accent)||'#7C5AE0');
  mountLogos();
  const html=DECK.slides.map((b,i)=>RENDER[b.type]?RENDER[b.type](b,i):'').join('');
  document.getElementById('deck').insertAdjacentHTML('beforeend',html);
  slides=document.querySelectorAll('.slide');total=slides.length;
  if(total)slides[0].classList.add('active');
  document.getElementById('ctr').textContent='1 / '+total;
  const dotsEl=document.getElementById('dots');
  slides.forEach((_,i)=>{const dd=document.createElement('div');dd.className='dn'+(i===0?' active':'');dd.onclick=()=>goTo(i);dotsEl.appendChild(dd);});
  document.getElementById('next').disabled=total<=1;
  Object.keys(WIDGETS).forEach(k=>{const cms=document.getElementById('cms-'+k),cfg=WIDGETS[k].cfg;
    if(cms&&cfg.greeting)cms.innerHTML=`<div class="msg bot"><div class="mav">${cfg.avatar||'AI'}</div><div class="bub">${cfg.greeting}</div></div>`;});
  mountCasePreviews();
  document.querySelectorAll('.ab-logo img').forEach(img=>{
    img.onerror=()=>{const p=img.parentNode;if(p)p.outerHTML='<span class="ab-ic">✦</span>';};});
  Object.keys(APPS).forEach(id=>Object.keys(APPS[id].views).forEach(vid=>{
    if(APPS[id].views[vid].kind==='table')updCount(id,vid);
    if(APPS[id].views[vid].kind==='dashboard')dashRender(dashKey(id,vid),false);
    if(APPS[id].views[vid].kind==='config')cfgCalc(id+'-'+vid);
    if(APPS[id].views[vid].kind==='pipeline')plPaint(id+'-'+vid);
    if(APPS[id].views[vid].kind==='tree'){const c=APPS[id].views[vid];if((c.routes||[])[0])trSide(id+'-'+vid,c.routes[0]);}
  }));
}

let slides,total,cur=0;
function goTo(n){if(!total)return;slides[cur].classList.remove('active');cur=Math.max(0,Math.min(total-1,n));slides[cur].classList.add('active');
  document.getElementById('ctr').textContent=(cur+1)+' / '+total;
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===total-1;
  document.querySelectorAll('.dn').forEach((d,i)=>d.classList.toggle('active',i===cur));
  animate(slides[cur]);}
function go(dir){goTo(cur+dir);}
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.isContentEditable))return;
  const csov=document.getElementById('csov'),qov=document.getElementById('qov');
  if(csov&&csov.classList.contains('on')){if(e.key==='Escape')closeCase();return;}
  if(qov&&qov.classList.contains('on')){if(e.key==='Escape')closePain();return;}
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);
  if(e.key==='Escape')closeModal();});
let tx=0;document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);
document.addEventListener('touchend',e=>{const dx=tx-e.changedTouches[0].clientX;if(Math.abs(dx)>50)go(dx>0?1:-1);});

function appNav(id,view,el){
  const win=document.querySelector(`[data-app="${id}"]`);
  win.querySelectorAll('.navitem').forEach(n=>n.classList.remove('on'));el.classList.add('on');
  win.querySelectorAll('.vpane').forEach(p=>p.classList.toggle('on',p.dataset.view===view));
  const vt=document.getElementById('vt-'+id);if(vt)vt.textContent=el.dataset.label||'';
  animate(win);
}
function applyRow(r){r.style.display=(r.dataset.hidF||r.dataset.hidS)?'none':'';}
function appSearch(id,q){
  const win=document.querySelector(`[data-app="${id}"]`);
  const pane=win.querySelector('.vpane.on');if(!pane)return;
  const vid=pane.dataset.view,tb=document.getElementById(`tb-${id}-${vid}`);if(!tb)return;
  const s=q.toLowerCase().trim();
  [...tb.rows].forEach(r=>{r.dataset.hidS=(!s||r.innerText.toLowerCase().includes(s))?'':'1';applyRow(r);});
  updCount(id,vid);
}
function tFilter(id,vid,btn,k){
  btn.parentNode.querySelectorAll('.tf').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  const tb=document.getElementById(`tb-${id}-${vid}`);
  [...tb.rows].forEach(r=>{r.dataset.hidF=(k==='all'||r.dataset.k===k)?'':'1';applyRow(r);});
  updCount(id,vid);closeDrawer(id,vid);
}
function updCount(id,vid){
  const tb=document.getElementById(`tb-${id}-${vid}`),c=document.getElementById(`tc-${id}-${vid}`);
  if(!tb||!c)return;const n=[...tb.rows].filter(r=>r.style.display!=='none').length;
  c.textContent=n+' de '+tb.rows.length+' registos';
}
function openDrawer(id,vid,ri){
  const d=APPS[id].views[vid].rows[ri].detail;if(!d)return;
  document.getElementById(`drt-${id}-${vid}`).textContent=d.title;
  document.getElementById(`drm-${id}-${vid}`).innerHTML=(d.meta||[]).map(m=>`<div class="dmr"><span class="dmk">${m.k}</span><span class="dmv">${m.v}</span></div>`).join('');
  document.getElementById(`drn-${id}-${vid}`).innerHTML=d.note||'';
  document.getElementById(`dra-${id}-${vid}`).innerHTML=(d.actions||[]).map((a,i)=>{
    const label=typeof a==='string'?a:a.label;
    return `<button class="dbtn${i===0?' primary':''}" onclick="rowAction('${id}','${vid}',${ri},${i})">${label}</button>`;}).join('');
  document.getElementById(`dr-${id}-${vid}`).classList.add('open');
}
/* Ação com CONSEQUÊNCIA: muda o estado da linha, atualiza contadores e notifica */
function rowAction(id,vid,ri,ai){
  const view=APPS[id].views[vid],row=view.rows[ri],a=(row.detail.actions||[])[ai];
  const cfg=(typeof a==='object')?a:{label:a};
  const tb=document.getElementById(`tb-${id}-${vid}`);
  const tr=[...tb.rows].find(r=>+r.dataset.ri===ri);
  if(cfg.to&&tr){
    const st=cfg.to;row.k=st.cls;row.status=st;tr.dataset.k=st.cls;
    const pill=tr.querySelector('.pill');
    if(pill){pill.className='pill '+st.cls;pill.innerHTML='<i></i>'+st.label;}
    tr.style.transition='background .5s';tr.style.background='var(--gg-l)';
    setTimeout(()=>tr.style.background='',900);
    updCount(id,vid);
  }
  toast(id,cfg.ico||'✓',cfg.toast||('<b>'+cfg.label+'</b> — feito'));
  closeDrawer(id,vid);
}
function closeDrawer(id,vid){const d=document.getElementById(`dr-${id}-${vid}`);if(d)d.classList.remove('open');}

function kbAdvance(card,id,vid){
  const board=document.getElementById(`kb-${id}-${vid}`);
  const cols=[...board.querySelectorAll('.kbcol')];
  const cur=cols.findIndex(c=>c.contains(card));
  const nxt=cols[(cur+1)%cols.length];
  nxt.querySelector('.kbcards').appendChild(card);
  kbCount(id,vid);
  toast(id,'↦','<b>'+card.querySelector('.kbc-t').textContent+'</b> → '+nxt.querySelector('.kbt').textContent);
}

function chatPush(k,who,html){const cms=document.getElementById('cms-'+k);if(!cms)return;
  const av=who==='user'?'EU':(WIDGETS[k].cfg.avatar||'AI');
  cms.insertAdjacentHTML('beforeend',`<div class="msg ${who}"><div class="mav">${av}</div><div class="bub">${html}</div></div>`);cms.scrollTop=cms.scrollHeight;}
function chatAnswer(k,html){const cms=document.getElementById('cms-'+k);
  cms.insertAdjacentHTML('beforeend',`<div class="msg bot typing"><div class="mav">${WIDGETS[k].cfg.avatar||'AI'}</div><div class="bub"><div class="tyd"><div class="td"></div><div class="td"></div><div class="td"></div></div></div></div>`);cms.scrollTop=cms.scrollHeight;
  setTimeout(()=>{const t=cms.querySelector('.typing');if(t)t.remove();chatPush(k,'bot',html);},850);}
function chatAsk(k,i){const s=WIDGETS[k].cfg.starters[i];chatPush(k,'user',s.q);chatAnswer(k,s.a);}
function chatSend(k){const inp=document.getElementById('cinp-'+k);const v=inp.value.trim();if(!v)return;inp.value='';chatPush(k,'user',v);
  const cfg=WIDGETS[k].cfg,low=v.toLowerCase();
  const hit=cfg.starters.find(s=>s.q.toLowerCase().split(' ').filter(w=>w.length>4).some(w=>low.includes(w.replace(/[?.,]/g,''))));
  chatAnswer(k,hit?hit.a:cfg.fallback);}

function openModule(id,i){const c=MODULES[id][i];if(!c.long)return;
  document.getElementById('mIco').textContent=c.ico||'';document.getElementById('mTag').textContent=c.tag||'';
  document.getElementById('mTitle').textContent=c.t;document.getElementById('mDesc').textContent=c.long;
  document.getElementById('mList').innerHTML=(c.bullets||[]).map(b=>`<li>${b}</li>`).join('');
  document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function animate(scope){
  scope.querySelectorAll('.bar').forEach(b=>{if(b.dataset.done)return;b.dataset.done='1';
    setTimeout(()=>{b.style.height=b.dataset.h+'%';},60);});
  scope.querySelectorAll('[data-count]').forEach(el=>{
    if(el.dataset.done)return;el.dataset.done='1';
    const raw=(el.dataset.count||el.textContent).trim();
    const m=raw.match(/^([^\d+-]*)([-+]?[\d.,]+)(.*)$/);if(!m)return;
    const pre=m[1],suf=m[3],numStr=m[2];
    const dec=numStr.includes(',')?1:0;
    const target=parseFloat(numStr.replace(/\./g,'').replace(',','.'));
    if(isNaN(target))return;let start=null;
    const fmt=x=>dec?x.toFixed(1).replace('.',','):String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    function step(t){if(!start)start=t;const p=Math.min((t-start)/900,1);el.textContent=pre+fmt(target*p)+suf;if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);});
}

/* Luzes na grelha — implementação de referência (com rastro),
   limitadas a 3 em simultâneo e bastante mais lentas. */
const GRID_W=130,GRID_H=119,MAX_LIGHTS=3;
let _lights=0;
function spawnLight(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(_lights>=MAX_LIGHTS)return;
  _lights++;
  const light=document.createElement("div");
  light.classList.add("grid-light");
  document.body.appendChild(light);
  const maxCols=Math.ceil(window.innerWidth/GRID_W);
  const maxRows=Math.ceil(window.innerHeight/GRID_H);
  const startX=Math.floor(Math.random()*maxCols)*GRID_W-1;
  const startY=Math.floor(Math.random()*maxRows)*GRID_H-1;
  light.style.left=startX+"px";light.style.top=startY+"px";
  const isHorizontal=Math.random()>.5;
  const distance=Math.floor(Math.random()*3)+1;
  const direction=Math.random()>.5?1:-1;
  light.classList.add(isHorizontal?"horizontal":"vertical");
  if(direction<0)light.classList.add("reverse");
  let endX=startX,endY=startY;
  if(isHorizontal)endX=startX+distance*GRID_W*direction;else endY=startY+distance*GRID_H*direction;
  const duration=3200+distance*1800;           /* 5,0s a 8,6s — lento */
  light.style.setProperty("--duration",duration+"ms");
  let ended=false;
  const finish=()=>{if(ended)return;ended=true;_lights--;light.remove();};
  light.animate([
    {opacity:0,transform:"translate(0, 0)"},
    {opacity:1,offset:.08},
    {opacity:1,offset:.98},
    {opacity:0,transform:`translate(${endX-startX}px, ${endY-startY}px)`}
  ],{duration:duration,easing:"ease-in-out",fill:"forwards"}).onfinish=finish;
  setTimeout(finish,duration+250);
}
setInterval(spawnLight,2200);

build();
animate(slides[0]);
