<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Flow · Motor de Apresentações Interativas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════════
     GM FLOW · MOTOR DE APRESENTAÇÕES INTERATIVAS  (v3)
     Camada 1 — MOTOR (fixo/seguro): marca + biblioteca de blocos e widgets.
     Camada 2 — DECK (topo do <script>): 100% por cliente, blocos OPCIONAIS.

     DESTAQUE v3: bloco 'app' = mockup REAL de webapp dentro do slide
     (sidebar navegável, topbar com pesquisa, dashboard com KPIs e gráfico,
      tabela de gestão com filtros e drawer de detalhe, quadro kanban,
      assistente). Demonstra o produto como se já estivesse construído.
═══════════════════════════════════════════════════════════════════════ -->

<style>
/* ══ PALETA OFICIAL GM FLOW — FIXA, NÃO ALTERAR ══
   Valores amostrados da barra de gradiente e do logótipo oficiais.
   Gradiente: #A57CF6 (roxo) → #6EC0F3 (azul) → #62E4A9 (verde)          */
:root{
  --gp:#A57CF6; --gb:#6EC0F3; --gg:#62E4A9;          /* gradiente oficial */
  --gp-l:#F0EAFD; --gb-l:#E8F5FD; --gg-l:#E6FBF1;    /* tons claros       */
  --brand:#79B6F7; --brand-deep:#2F7FE0;             /* azuis do site     */
  --dark:#1A1A2E; --ink2:#151527; --text:#2D2D3A; --muted:#7A7A9A;
  --border:#E8E8F0; --bg:#FAFAFA; --white:#FFFFFF;
  --ok:#2AAF72; --warn:#E8A33D; --crit:#2E5C9A;
  --grad:linear-gradient(90deg,var(--gp) 0%,var(--gb) 50%,var(--gg) 100%);
  --accent:#7C5AE0;                                   /* roxo de texto (AA) */
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background-color:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;
  background-image:linear-gradient(to right,rgba(10,10,10,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(10,10,10,.05) 1px,transparent 1px);
  background-size:130px 119px;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-50;pointer-events:none;
  background:radial-gradient(60rem 40rem at 85% 0%,rgba(155,127,224,.12),transparent 60%),radial-gradient(50rem 35rem at 0% 20%,rgba(110,198,245,.09),transparent 60%),radial-gradient(70rem 50rem at 50% 95%,rgba(82,237,170,.09),transparent 60%)}
.grid-light{position:absolute;opacity:0;width:2px;height:2px;background-color:#fff;border-radius:50%;pointer-events:none;z-index:-20;
  box-shadow:0 0 3px 1px rgba(255,255,255,.7),0 0 10px 3px rgba(47,127,224,.35),0 0 22px 7px rgba(47,127,224,.12)}
.grid-light::after{content:"";position:absolute;z-index:-20}
.grid-light.horizontal::after{top:0;right:100%;width:0;height:3px;background:linear-gradient(to left,rgba(47,127,224,.45),transparent);animation:trail-h var(--duration) ease-in-out forwards}
.grid-light.horizontal.reverse::after{right:auto;left:100%;background:linear-gradient(to right,rgba(47,127,224,.45),transparent)}
.grid-light.vertical::after{left:0;bottom:100%;width:3px;height:0;background:linear-gradient(to top,rgba(47,127,224,.45),transparent);animation:trail-v var(--duration) ease-in-out forwards}
.grid-light.vertical.reverse::after{bottom:auto;top:100%;background:linear-gradient(to bottom,rgba(47,127,224,.45),transparent)}
@keyframes trail-h{0%{width:0}25%{width:80px}45%{width:80px}100%{width:0}}
@keyframes trail-v{0%{height:0}25%{height:80px}45%{height:80px}100%{height:0}}
/* logo do cliente na sidebar das demos */
.ab-logo{background:#fff;border-radius:8px;padding:5px 8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;max-width:108px}
.ab-logo img{height:20px;width:auto;max-width:92px;object-fit:contain;display:block}
.gbar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:200}

/* HEADER — logos grandes e do mesmo tamanho */
.hdr{position:fixed;top:4px;left:0;right:0;height:70px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 42px;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.hlogos{display:flex;align-items:center;gap:22px}
.logoslot{height:42px;display:flex;align-items:center}
.logoslot img{height:42px;width:auto;max-width:220px;object-fit:contain;display:block}
.sep{width:1px;height:30px;background:var(--border)}
.clientname{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:var(--dark);letter-spacing:-.01em;white-space:nowrap}
.hctr{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}

.deck{padding-top:74px;height:100vh;position:relative}
.slide-wave{background:transparent;position:fixed;bottom:-80px;right:0;left:0;width:100%;height:540px;object-fit:contain;object-position:right bottom;pointer-events:none;z-index:0;transform:scaleX(-1);opacity:.8}
.slide{position:absolute;top:74px;left:0;right:0;bottom:46px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px 56px 56px;opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:1}
.slide.active{opacity:1;pointer-events:all}

.slbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.stitle{font-family:'Playfair Display',serif;font-size:clamp(24px,3vw,42px);font-weight:600;line-height:1.2;color:var(--dark);margin-bottom:12px}
.stitle em,.sttl em{color:var(--accent);font-style:normal}
.sbody{font-size:15px;color:var(--muted);line-height:1.7;font-weight:300;max-width:580px}
.wide{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.tc-center{text-align:center}

#cover{text-align:center}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:24px}
.cover-h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5.2vw,60px);font-weight:600;line-height:1.1;color:var(--dark);margin-bottom:18px}
.cover-h1 em{font-style:normal;color:var(--accent)}
.cover-sub{font-size:16px;color:var(--muted);line-height:1.65;font-weight:300;max-width:540px;margin:0 auto 26px}
.gline{height:2px;width:80px;background:var(--grad);margin:0 auto 24px;border-radius:2px}
.cover-meta{display:flex;align-items:center;justify-content:center;gap:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em}
.ms{width:4px;height:4px;border-radius:50%;background:var(--border)}

/* problems */
.pgrid{display:grid;gap:16px;margin-top:22px;width:100%;max-width:900px}
.pc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.07)}
.pca{position:absolute;top:0;left:0;right:0;height:3px}
.pca.pp{background:var(--gp)}.pca.pb{background:var(--gb)}.pca.pg{background:var(--gg)}
.pnum{font-family:'Playfair Display',serif;font-size:44px;font-weight:700;color:var(--border);line-height:1;margin-bottom:6px}
.pc h3{font-size:16.5px;font-weight:600;color:var(--dark);margin-bottom:7px}
.pc p{font-size:13.5px;color:var(--muted);line-height:1.6;font-weight:300}

/* ask */
.askgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;width:100%;max-width:980px;margin-top:18px}
.askc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;transition:transform .2s,box-shadow .2s}
.askc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.07)}
.askn{font-family:'DM Mono';font-size:10px;letter-spacing:.15em;color:var(--accent);margin-bottom:8px}
.askc h4{font-size:14.5px;font-weight:600;color:var(--dark);margin-bottom:6px;line-height:1.35}
.askc p{font-size:12.5px;color:var(--muted);line-height:1.55;font-weight:300}
.askc .quote{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.5}

/* ══════════════ APP MOCKUP ══════════════ */
.apphead{display:flex;align-items:flex-end;justify-content:space-between;width:100%;max-width:1090px;gap:24px;margin-bottom:12px}
.apphead .left{min-width:0}
.apphead .stitle{margin-bottom:4px;font-size:clamp(20px,2.4vw,30px)}
.apphead .sub{font-size:13.5px;color:var(--muted);font-weight:300;line-height:1.5;max-width:580px}
.apphint{font-family:'DM Mono';font-size:10.5px;letter-spacing:.06em;color:var(--accent);background:var(--gp-l);padding:7px 13px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.appwin{width:100%;max-width:1090px;height:min(500px,60vh);background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 70px rgba(26,26,46,.16),0 4px 14px rgba(26,26,46,.06)}
.appbar{height:36px;background:var(--ink2);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.dot3{display:flex;gap:6px}.dot3 i{width:9px;height:9px;border-radius:50%;display:block}
.dot3 i:nth-child(1){background:rgba(255,255,255,.26)}.dot3 i:nth-child(2){background:rgba(255,255,255,.18)}.dot3 i:nth-child(3){background:rgba(255,255,255,.12)}
.appurl{flex:1;display:flex;justify-content:center}
.appurl span{font-family:'DM Mono';font-size:10.5px;color:rgba(255,255,255,.45);background:rgba(255,255,255,.07);padding:4px 16px;border-radius:20px;letter-spacing:.03em}
.appbody{flex:1;display:flex;min-height:0}
.appside{width:184px;background:var(--ink2);flex-shrink:0;display:flex;flex-direction:column;padding:15px 11px;gap:3px;position:relative}
.appside::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(155,127,224,.35),transparent)}
.appbrand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.appbrand .ab-ic{width:26px;height:26px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.appbrand .ab-t{font-size:12.5px;font-weight:600;color:#fff;line-height:1.2}
.appbrand .ab-s{font-family:'DM Mono';font-size:8.5px;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12.5px;transition:all .2s;position:relative}
.navitem:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.82)}
.navitem.on{background:linear-gradient(90deg,rgba(155,127,224,.30),rgba(110,198,245,.10));color:#fff;font-weight:500}
.navitem.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--grad)}
.navitem .ni{width:16px;text-align:center;font-size:12px;opacity:.9}
.navbadge{margin-left:auto;font-family:'DM Mono';font-size:9px;background:var(--gp);color:#fff;border-radius:9px;padding:1px 6px}
.appside .foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.07)}
.avat{width:26px;height:26px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.appside .foot .fn{font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.2}
.appside .foot .fr{font-family:'DM Mono';font-size:8.5px;color:rgba(255,255,255,.3)}
.appmain{flex:1;display:flex;flex-direction:column;min-width:0;background:#FBFBFD}
.apptop{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0;background:rgba(255,255,255,.75);backdrop-filter:blur(8px)}
.vtitle{font-size:14px;font-weight:600;color:var(--dark);white-space:nowrap}
.asearch{margin-left:auto;position:relative;display:flex;align-items:center}
.asearch input{width:180px;border:1px solid var(--border);border-radius:18px;padding:7px 13px 7px 30px;font-size:12px;font-family:'DM Sans';outline:none;background:var(--white);color:var(--text);transition:width .2s}
.asearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--gp-l);width:215px}
.asearch .si{position:absolute;left:11px;font-size:12px;color:var(--muted);pointer-events:none}
.abell{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;cursor:pointer;flex-shrink:0}
.abell::after{content:'';position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:1.5px solid #fff}
.appview{flex:1;padding:16px 18px;overflow:hidden;position:relative;min-height:0;display:flex;flex-direction:column}
.vpane{display:none;animation:vin .32s ease}
.vpane.on{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* seletor de período (segmented) */
.segrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.seg{display:inline-flex;background:#EFEFF5;border-radius:20px;padding:3px;gap:2px}
.seg button{font-family:'DM Sans';font-size:11.5px;padding:5px 14px;border-radius:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--white);color:var(--dark);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.seghint{font-family:'DM Mono';font-size:9.5px;color:var(--muted);margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:11px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .2s;position:relative}
.kpi:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.kpi.sel{border-color:var(--accent);background:linear-gradient(180deg,var(--gp-l),var(--white))}
.kpi.sel::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--grad);border-radius:2px}
/* faixa de detalhe (drill-down) */
.dstrip{background:var(--white);border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:10px;padding:11px 14px;margin-bottom:11px;display:none;animation:vin .25s ease}
.dstrip.on{display:block}
.dstrip .dst-t{font-size:12.5px;font-weight:600;color:var(--dark);margin-bottom:5px}
.dstrip .dst-b{display:flex;gap:16px;flex-wrap:wrap}
.dstrip .dst-i{font-size:11.5px;color:var(--muted)}
.dstrip .dst-i b{color:var(--dark);font-weight:600}
.dstrip .dst-x{float:right;cursor:pointer;color:var(--muted);font-size:12px;line-height:1}
.kpi-l{font-family:'DM Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;line-height:1.3}
.kpi-v{font-family:'Playfair Display';font-size:25px;font-weight:700;color:var(--dark);line-height:1}
.kpi-d{font-size:10.5px;margin-top:4px;font-weight:500}
.kpi-d.up{color:var(--ok)}.kpi-d.down{color:var(--crit)}.kpi-d.flat{color:var(--muted)}
.drow{display:grid;grid-template-columns:1.55fr 1fr;gap:11px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.card-t{font-size:12.5px;font-weight:600;color:var(--dark)}
.card-s{font-family:'DM Mono';font-size:9.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:112px;padding-top:14px}
.barwrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bar{width:100%;background:var(--gp);border-radius:4px 4px 0 0;height:0;transition:height .6s cubic-bezier(.2,.8,.2,1),background .2s}
.barwrap:hover .bar{background:#7d5fd0}
.barwrap.sel .bar{background:var(--dark)}
.fitem{cursor:pointer;border-radius:8px;padding:3px 5px;margin:-3px -5px;transition:background .18s}
.fitem:hover{background:#F6F5FC}
.blabels{display:flex;gap:6px;margin-top:7px}
.blabels span{flex:1;text-align:center;font-family:'DM Mono';font-size:9px;color:var(--muted)}
.btip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:10.5px;font-family:'DM Mono';padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.barwrap:hover .btip{opacity:1}
.gridline{position:absolute;left:0;right:0;height:1px;background:var(--border);opacity:.7}
.feed{display:flex;flex-direction:column;gap:9px}
.fitem{display:flex;gap:9px;align-items:flex-start}
.fdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.ftxt{flex:1;font-size:11.5px;color:var(--text);line-height:1.45}
.ftime{font-family:'DM Mono';font-size:9px;color:var(--muted);white-space:nowrap}

.tfilters{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.tf{font-size:11.5px;padding:6px 13px;border-radius:16px;border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;transition:all .18s;font-family:'DM Sans'}
.tf:hover{border-color:var(--accent)}
.tf.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.tcount{margin-left:auto;font-family:'DM Mono';font-size:10px;color:var(--muted)}
.ttable{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ttable th{font-family:'DM Mono';font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 14px;background:#F7F7FB;border-bottom:1px solid var(--border);font-weight:500}
.ttable td{padding:10px 14px;font-size:12px;color:var(--text);border-bottom:1px solid #F2F2F7}
.ttable tbody tr{cursor:pointer;transition:background .15s}
.ttable tbody tr:hover{background:#FAF9FE}
.ttable tbody tr:last-child td{border-bottom:none}
.tmain{font-weight:600;color:var(--dark);display:block}
.tsub{font-family:'DM Mono';font-size:9.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;padding:3px 10px;border-radius:12px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;display:block;flex-shrink:0}
.pill.ok{background:var(--gg-l);color:#1E7F52}.pill.ok i{background:var(--ok)}
.pill.warn{background:#FDF3E3;color:#8A5D12}.pill.warn i{background:var(--warn)}
.pill.proc{background:var(--gb-l);color:#26708F}.pill.proc i{background:var(--gb)}
.pill.crit{background:#E7EFFA;color:#234B7D}.pill.crit i{background:var(--crit)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:296px;background:var(--white);border-left:1px solid var(--border);box-shadow:-14px 0 40px rgba(26,26,46,.10);transform:translateX(104%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.dhead h4{font-size:14px;font-weight:600;color:var(--dark);line-height:1.3;flex:1}
.dclose{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:11px;color:var(--muted);flex-shrink:0;line-height:1}
.dbody{padding:15px 17px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:13px}
.dmeta{display:flex;flex-direction:column;gap:8px}
.dmr{display:flex;justify-content:space-between;gap:10px;font-size:11.5px}
.dmk{color:var(--muted);font-family:'DM Mono';font-size:10px;letter-spacing:.04em}
.dmv{color:var(--dark);font-weight:500;text-align:right}
.dnote{background:var(--gp-l);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--text)}
.dacts{display:flex;gap:7px;margin-top:auto;padding-top:10px}
.dbtn{flex:1;font-size:11.5px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;font-family:'DM Sans';transition:all .18s}
.dbtn.primary{background:var(--grad);color:#fff;border:none;font-weight:500}
.dbtn:hover{border-color:var(--accent)}

.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.kbcol{background:#F4F4F8;border-radius:12px;padding:10px;min-height:130px}
.kbh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}
.kbt{font-size:11.5px;font-weight:600;color:var(--dark)}
.kbn{font-family:'DM Mono';font-size:9.5px;color:var(--muted);background:var(--white);border-radius:9px;padding:1px 7px}
.kbcard{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:all .2s;animation:vin .25s ease}
.kbcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09);border-color:var(--accent)}
.kbc-t{font-size:11.5px;font-weight:600;color:var(--dark);margin-bottom:4px;line-height:1.35}
.kbc-s{font-family:'DM Mono';font-size:9.5px;color:var(--muted)}
.kbhint{font-family:'DM Mono';font-size:9.5px;color:var(--muted);margin-top:10px;text-align:center}

.achat{display:flex;flex-direction:column;flex:1;min-height:0}
.acms{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px;min-height:0}
.msg{display:flex;gap:8px;align-items:flex-start;animation:vin .3s ease}
.msg.user{flex-direction:row-reverse}
.mav{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
.msg.user .mav{background:var(--gb-l);color:#26708F;border:1px solid rgba(110,198,245,.3)}
.msg.bot .mav{background:var(--gp-l);color:var(--gp);border:1px solid rgba(155,127,224,.3)}
.bub{padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.55;max-width:84%}
.msg.user .bub{background:var(--dark);color:#E8E8F8;border-top-right-radius:3px}
.msg.bot .bub{background:var(--white);color:var(--text);border:1px solid var(--border);border-top-left-radius:3px}
.bub strong{color:var(--accent)}
.ti{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:3px;font-family:'DM Mono'}
.tdoc{background:var(--gg-l);color:#1E7F52}
.tcrm{background:var(--gp-l);color:var(--gp)}
.tyd{display:flex;gap:4px;padding:3px 2px}
.td{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tb 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.acopts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 8px}
.copt{font-family:'DM Sans';font-size:11.5px;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;transition:all .18s}
.copt:hover{background:var(--gp-l);border-color:var(--accent);color:var(--accent)}
.acin{display:flex;gap:7px}
.acin input{flex:1;min-width:0;border:1px solid var(--border);border-radius:18px;padding:8px 14px;font-size:12px;font-family:'DM Sans';outline:none;background:var(--white)}
.acin input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--gp-l)}
.acin button{width:34px;height:34px;border-radius:50%;border:none;background:var(--grad);color:#fff;font-size:13px;cursor:pointer;flex-shrink:0}

/* cards + modal */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%;max-width:960px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.mc:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09)}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.mc-ico{font-size:22px;margin-bottom:8px;display:block}
.mc-n{position:absolute;top:14px;right:16px;font-family:'Playfair Display';font-weight:700;font-size:14px;color:var(--border)}
.mc-tag{font-family:'DM Mono';font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.mc-t{font-size:14.5px;font-weight:600;color:var(--dark);margin-bottom:4px;padding-right:18px}
.mc-d{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:300}
.mc-more{font-family:'DM Mono';font-size:9.5px;letter-spacing:.1em;color:var(--accent);margin-top:9px}
.modal{position:fixed;inset:0;background:rgba(26,26,46,.55);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:24px}
.modal.show{opacity:1;pointer-events:all}
.modal-card{background:var(--white);border-radius:18px;max-width:520px;width:100%;padding:32px 36px;position:relative;transform:translateY(12px) scale(.98);transition:transform .28s;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.show .modal-card{transform:none}
.modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:18px 18px 0 0;background:var(--grad)}
.modal-close{position:absolute;top:15px;right:17px;width:29px;height:29px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:14px;color:var(--muted)}
.modal-ico{font-size:32px;margin-bottom:11px;display:block}
.modal-tag{font-family:'DM Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.modal-card h3{font-family:'Playfair Display';font-size:25px;font-weight:600;color:var(--dark);margin-bottom:11px}
.modal-card p{font-size:14px;color:var(--muted);line-height:1.65;font-weight:300;margin-bottom:13px}
.modal-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.modal-list li{display:flex;gap:9px;font-size:13px;color:var(--text);line-height:1.5}
.modal-list li::before{content:'✓';color:var(--ok);font-weight:800;flex-shrink:0}


/* GARANTIAS */
.guargrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:880px;margin-top:6px}
.guarc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px 22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.guarc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.08)}
.guarc::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
.guarc:nth-child(1)::before{background:var(--gp)}
.guarc:nth-child(2)::before{background:var(--gb)}
.guarc:nth-child(3)::before{background:linear-gradient(180deg,var(--gb),var(--gg))}
.guarc:nth-child(4)::before{background:var(--gg)}
.guar-i{font-size:22px;display:block;margin-bottom:9px}
.guarc h4{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:6px}
.guarc p{font-size:13px;color:var(--muted);line-height:1.55;font-weight:300}

/* CAIXA DE CONTACTO */
.contactbox{margin-top:18px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;width:100%;max-width:820px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.contactbox h3{font-size:17px;font-weight:700;color:var(--dark);margin-bottom:3px}
.contactbox p{font-size:13.5px;color:var(--muted);font-weight:300}
.contactbox .cright{text-align:right}
.contactbox .cright b{display:block;font-size:15px;color:var(--dark);font-weight:600}
.contactbox .cright span{font-size:13.5px;color:var(--muted)}

.iw{max-width:720px;width:100%}
.ib{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:36px 52px;text-align:center;position:relative;overflow:hidden;margin-top:20px;box-shadow:0 12px 40px rgba(26,26,46,.08);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ib::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.price{font-family:'Playfair Display';font-size:62px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:6px}
.psub{font-size:13px;color:var(--muted);letter-spacing:.05em}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px;text-align:left}
.ii{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);line-height:1.4}
.ii .ic2{color:#1E7F52;flex-shrink:0;margin-top:1px;font-weight:700}
.guar{margin-top:18px;padding:11px 18px;border:1px solid rgba(98,228,169,.45);border-radius:10px;background:var(--gg-l);font-size:12.5px;color:#1E7F52;font-weight:500}
.inote{font-size:11px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.5;font-family:'DM Mono'}
.ptable{width:100%;max-width:760px;border-collapse:collapse;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:4px}
.ptable thead tr{background:var(--grad)}
.ptable th{padding:10px 18px;font-family:'DM Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-align:left}
.ptable tbody tr{background:var(--white);border-bottom:1px solid var(--border)}
.ptable td{padding:11px 18px;vertical-align:middle}
.ptd-t{font-size:14px;font-weight:600;color:var(--dark);display:block;margin-bottom:2px}
.ptd-s{font-size:12px;color:var(--muted)}
.ptd-v{font-size:14.5px;font-weight:600;color:var(--dark);white-space:nowrap;text-align:right}
.ptag{font-family:'DM Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:12px;background:var(--gp-l);color:var(--gp)}
.ptotal{margin-top:11px;background:var(--dark);border-radius:14px;padding:15px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:#fff;max-width:760px;width:100%}
.ptotal .pt-v{font-family:'Playfair Display';font-size:30px;font-weight:700;color:var(--accent)}
.ptotal .pt-l{font-family:'DM Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.ptotal .pt-s{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.5}

.steps{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px;margin-top:22px}
.stc{flex:1;min-width:185px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.stn{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-family:'Playfair Display';font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 11px}
.stc h4{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:5px}
.stc p{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:300}
.validity{margin-top:20px;font-family:'DM Mono';font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}

.ftr{position:fixed;bottom:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;gap:14px;z-index:100}
.nbtn{width:33px;height:33px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--accent);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.nbtn:hover{background:var(--gp-l);border-color:var(--accent)}
.nbtn:disabled{opacity:.25;cursor:default}
.dots{display:flex;gap:5px;align-items:center}
.dn{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer}
.dn.active{background:var(--accent);width:18px;border-radius:3px}


/* ══════════ CONSULTORIA · GANTT DE FASES ══════════ */
.ph{width:100%;max-width:1120px}
.ph-weeks{display:grid;gap:0;margin-bottom:7px}
.ph-weeks span{font-family:'DM Sans';font-size:12px;font-weight:600;color:#6B7391;text-align:center}
.ph-rule{height:1px;background:var(--border);margin-bottom:14px}
.ph-bars{display:grid;gap:9px;align-items:stretch}
.ph-bar{border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:104px;position:relative;overflow:hidden}
.ph-bar h4{font-size:17px;font-weight:700;line-height:1.25;margin-bottom:5px}
.ph-bar span{font-size:12.5px;opacity:.85}
.ph-bar.prep{background:#EDEEF2;border:1px solid #E1E3EA;align-items:center;text-align:center}
.ph-bar.prep h4{color:#4A5068;font-size:15px}
.ph-bar.prep span{color:#7A8098}
.ph-bar.p1{background:linear-gradient(100deg,#A57CF6,#8E96F5);color:#fff}
.ph-bar.p2{background:linear-gradient(100deg,#8199F6,#6EC0F3);color:#fff}
.ph-bar.p3{background:linear-gradient(100deg,#69CFD8,#62E4A9);color:#fff}
.ph-legend{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.ph-legend span{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#6B7391}
.ph-legend i{width:13px;height:13px;border-radius:4px;display:block}
.ph-legend i.prep{background:#DDDFE6}
.ph-legend i.p1{background:#A57CF6}
.ph-legend i.p2{background:#6EC0F3}
.ph-legend i.p3{background:#62E4A9}

/* ══════════ CONSULTORIA · TIMELINE DE MARCOS ══════════ */
.tl{width:100%;max-width:1120px;--tc:#7C5AE0;--tcb:#F0EAFD;--tct:#6B4BD0}
.tl.c-prep{--tc:#8A8FA5;--tcb:#F1F1F5;--tct:#5C6178}
.tl.c-p2{--tc:#3E8FE8;--tcb:#E8F5FD;--tct:#2559A8}
.tl.c-p3{--tc:#35C495;--tcb:#E6FBF1;--tct:#17805B}
.tl-bands{display:flex;gap:11px;margin-bottom:6px}
.tl-band{background:var(--tcb);color:var(--tct);border-radius:10px;padding:9px 12px;text-align:center;font-size:12.5px;font-weight:600}
.tl-track{position:relative;display:grid;min-height:322px}
.tl-line{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);background:var(--tc);opacity:.85;z-index:0}
.tl-col{position:relative;display:flex;align-items:center;justify-content:center}
.tl-dot{width:15px;height:15px;border-radius:50%;background:var(--tc);position:relative;z-index:2;box-shadow:0 0 0 6px color-mix(in srgb,var(--tc) 16%,transparent)}
.tl-stem{position:absolute;left:50%;transform:translateX(-50%);width:1.5px;background:var(--tc);opacity:.45;z-index:1}
.tl-stem.up{bottom:calc(50% + 9px);height:30px}
.tl-stem.down{top:calc(50% + 9px);height:30px}
.tl-card{position:absolute;left:6px;right:6px;background:var(--white);border:1px solid var(--border);border-radius:13px;padding:14px 16px;box-shadow:0 5px 18px rgba(26,26,46,.07);z-index:2}
.tl-card.up{bottom:calc(50% + 38px)}
.tl-card.down{top:calc(50% + 38px)}
.tl-card h4{font-size:14.5px;font-weight:700;color:var(--tct);line-height:1.3;margin-bottom:5px}
.tl-card p{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:300}
.tl-card p b{color:var(--tct);font-weight:600}
.tl-card.mark{border-color:var(--tc)}
.tl-card.hl{background:linear-gradient(100deg,#69CFD8,#62E4A9);border:none;box-shadow:0 8px 24px rgba(98,228,169,.35)}
.tl-card.hl h4{color:#fff}
.tl-card.hl p{color:rgba(255,255,255,.92);font-weight:400}


/* ══════════ TOASTS (ações com consequência) ══════════ */
.toasts{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none}
.toast{background:var(--dark);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 10px 30px rgba(26,26,46,.28);animation:tin .3s ease;max-width:290px}
.toast i{width:18px;height:18px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-style:normal}
.toast b{color:var(--gg);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .3s ease forwards}
@keyframes tout{to{opacity:0;transform:translateX(12px)}}

/* ══════════ VISTA: UPLOAD + OCR AO VIVO ══════════ */
.up-wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;height:100%;min-height:0}
.dropzone{border:2px dashed var(--border);border-radius:14px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;padding:20px;text-align:center;transition:all .22s;cursor:pointer;position:relative;overflow:hidden}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--gp-l)}
.dz-ico{font-size:34px}
.dz-t{font-size:13.5px;font-weight:600;color:var(--dark)}
.dz-s{font-size:11.5px;color:var(--muted);line-height:1.5}
.dz-files{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.dz-file{font-size:11px;padding:5px 11px;border-radius:14px;background:var(--white);border:1px solid var(--border);cursor:grab;transition:all .18s}
.dz-file:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.dz-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--grad);width:0;transition:width .25s linear}
.ocr{background:var(--white);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.ocr-h{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#F9F9FC}
.ocr-h span{font-size:12.5px;font-weight:600;color:var(--dark)}
.ocr-st{font-family:'DM Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ocr-b{padding:13px 15px;display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1}
.ocr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;background:#FAFAFC;border:1px solid transparent;opacity:.35;transition:all .3s}
.ocr-row.on{opacity:1;background:var(--white);border-color:var(--border)}
.ocr-row.on.hit{border-color:color-mix(in srgb,var(--gg) 55%,transparent);background:var(--gg-l)}
.ocr-k{font-family:'DM Mono';font-size:10px;letter-spacing:.05em;color:var(--muted)}
.ocr-v{font-size:12.5px;font-weight:600;color:var(--dark);text-align:right}
.ocr-conf{font-family:'DM Mono';font-size:9.5px;color:#1E7F52}
.ocr-f{padding:11px 15px;border-top:1px solid var(--border);display:flex;gap:8px}

/* ══════════ VISTA: DIAGRAMA DE FLUXO ══════════ */
.fw{display:flex;flex-direction:column;height:100%;min-height:0}
.fw-canvas{flex:1;display:flex;align-items:center;justify-content:center;gap:0;padding:8px 4px;min-height:0;flex-wrap:wrap}
.fnode{background:var(--white);border:1.5px solid var(--border);border-radius:13px;padding:13px 15px;min-width:118px;max-width:150px;text-align:center;cursor:pointer;
  transition:all .25s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.fnode:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.09)}
.fnode.on{border-color:var(--accent);background:var(--gp-l);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 22%,transparent)}
.fnode.done{border-color:color-mix(in srgb,var(--gg) 60%,transparent);background:var(--gg-l)}
.fn-ico{font-size:20px;display:block;margin-bottom:6px}
.fn-t{font-size:12.5px;font-weight:600;color:var(--dark);line-height:1.3}
.fn-s{font-family:'DM Mono';font-size:9.5px;color:var(--muted);margin-top:3px}
.fn-badge{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:var(--grad);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.fnode.done .fn-badge{opacity:1}
.farrow{flex:0 0 34px;height:2px;background:var(--border);position:relative;transition:background .3s}
.farrow.lit{background:var(--accent)}
.farrow::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-left:6px solid var(--border);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:border-color .3s}
.farrow.lit::after{border-left-color:var(--accent)}
.fw-detail{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;padding:12px 15px;margin-top:6px;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.fw-detail h5{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.fw-detail p{font-size:12px;color:var(--muted);line-height:1.5}
.fw-bar{display:flex;gap:8px;align-items:center;margin-top:8px}
.fw-btn{font-family:'DM Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--grad);color:#fff;border:none;border-radius:14px;padding:7px 15px;cursor:pointer}
.fw-prog{flex:1;height:5px;border-radius:4px;background:var(--border);overflow:hidden}
.fw-prog span{display:block;height:100%;background:var(--grad);width:0;transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* ══════════ VISTA: CONFIGURADOR (sliders) ══════════ */
.cfg{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;height:100%;min-height:0}
.cfg-in{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:15px;overflow:auto}
.cfg-row label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--text);margin-bottom:7px}
.cfg-row label b{font-family:'DM Mono';font-size:12.5px;color:var(--accent)}
.cfg-row input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:var(--border);outline:none}
.cfg-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--white);border:2.5px solid var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cfg-row input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--white);border:2.5px solid var(--accent);cursor:pointer}
.cfg-toggles{display:flex;gap:7px;flex-wrap:wrap}
.cfg-tg{font-size:11.5px;padding:7px 13px;border-radius:18px;border:1px solid var(--border);background:var(--white);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px}
.cfg-tg .tgd{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.cfg-tg.on{border-color:var(--accent);background:var(--gp-l);color:var(--accent);font-weight:500}
.cfg-tg.on .tgd{border-color:var(--accent);background:var(--accent)}
.cfg-out{background:var(--dark);border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:13px;position:relative;overflow:hidden}
.cfg-out::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.cfg-hero{text-align:center}
.cfg-hl{font-family:'DM Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.cfg-hv{font-family:'Playfair Display';font-size:44px;font-weight:700;color:#fff;line-height:1}
.cfg-hs{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:5px}
.cfg-lines{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:13px}
.cfg-line{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6)}
.cfg-line b{color:#fff;font-weight:600}

/* ══════════ VISTA: CALENDÁRIO / AGENDA ══════════ */
.cal{display:flex;flex-direction:column;height:100%;min-height:0;gap:10px}
.cal-head{display:flex;align-items:center;gap:10px}
.cal-title{font-size:13px;font-weight:600;color:var(--dark)}
.cal-nav{margin-left:auto;display:flex;gap:6px}
.cal-nav button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--muted);font-size:12px}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1;min-height:0}
.cal-col{display:flex;flex-direction:column;gap:6px;min-height:0}
.cal-dh{text-align:center;padding:7px 4px;border-radius:9px;background:#F4F4F8}
.cal-dh b{display:block;font-size:12px;color:var(--dark);font-weight:600}
.cal-dh span{font-family:'DM Mono';font-size:9.5px;color:var(--muted)}
.cal-slots{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
.slot{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:11.5px;cursor:pointer;transition:all .18s;background:var(--white)}
.slot:hover{border-color:var(--accent);transform:translateY(-1px)}
.slot.busy{background:#F6F6FA;color:var(--muted);cursor:not-allowed;border-style:dashed}
.slot.busy:hover{transform:none;border-color:var(--border)}
.slot.sel{background:var(--grad);color:#fff;border:none;font-weight:600;box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.slot b{display:block;font-family:'DM Mono';font-size:10px;opacity:.75;font-weight:400}
.cal-foot{background:var(--gp-l);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12px;color:var(--text);min-height:40px;display:flex;align-items:center}

/* legenda de séries do gráfico */
.ch-leg{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.ch-leg button{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:'DM Sans';font-size:11px;color:var(--muted);padding:2px 0;transition:opacity .2s}
.ch-leg button.off{opacity:.35;text-decoration:line-through}
.ch-leg i{width:10px;height:10px;border-radius:3px;display:block}
.bar.s2{background:var(--gb)}
.barwrap:hover .bar.s2{background:#4EA8DC}


/* ═════════ CASOS DE ESTUDO ═════════ */
.csgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:6px}
.cscard{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s,border-color .28s;display:flex;flex-direction:column}
.cscard:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(26,26,46,.13);border-color:transparent}
.csprev{position:relative;height:236px;overflow:hidden;background:#F0F2F5;border-bottom:1px solid var(--border)}
.csprev iframe{position:absolute;top:0;left:0;width:1440px;border:0;transform-origin:0 0;pointer-events:none}
.csprev .csveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.9))}
.csprev .csopen{position:absolute;right:14px;bottom:13px;background:var(--dark);color:#fff;border-radius:999px;
  font-family:'DM Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;
  opacity:0;transform:translateY(6px);transition:.28s}
.cscard:hover .csopen{opacity:1;transform:none}
.csmeta{padding:17px 19px 19px;display:flex;flex-direction:column;gap:7px}
.csmeta .cs-n{font-family:'DM Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.csmeta .cs-t{font-size:17px;font-weight:600;color:var(--text);line-height:1.25;letter-spacing:-.01em}
.csmeta .cs-p{font-size:12.5px;color:var(--muted);line-height:1.5}
.cstags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cstag{font-family:'DM Mono';font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
  background:rgba(124,90,224,.09);border-radius:5px;padding:4px 8px}
#csov{position:fixed;inset:0;z-index:400;background:#fff;opacity:0;pointer-events:none;transition:opacity .28s}
#csov.on{opacity:1;pointer-events:auto}
#csframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#csclose{position:absolute;right:18px;bottom:18px;z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--dark);color:#fff;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;
  font-family:'DM Mono';font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  box-shadow:0 12px 34px rgba(20,20,34,.34);transition:transform .2s,box-shadow .2s}
#csclose:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(20,20,34,.42)}
#csclose .csx{font-size:13px;line-height:1;opacity:.7}
#csclose .csn{color:rgba(255,255,255,.5);text-transform:none;letter-spacing:.02em}
@media(max-width:900px){.csgrid{grid-template-columns:1fr}.csprev{height:190px}}

/* ═════════ NECESSIDADES: a lista âncora ═════════ */
.nlist{width:100%;max-width:900px;margin-top:16px;border-top:1px solid var(--border)}
.nrow{border-bottom:1px solid var(--border);cursor:pointer;transition:background .22s}
.nrow:hover{background:#FAFAFD}
.nhead{display:flex;align-items:center;gap:16px;padding:13px 10px}
.nnum{font-family:'DM Mono';font-size:11px;letter-spacing:.1em;color:#C0C0D2;flex-shrink:0;width:20px}
.nrow.on .nnum{color:var(--accent)}
.nmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nt{font-size:14.5px;font-weight:600;color:var(--text);letter-spacing:-.01em;line-height:1.3}
.np{font-size:11.5px;color:var(--muted);line-height:1.45}
.nchip{font-family:'DM Mono';font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;
  border-radius:6px;white-space:nowrap;flex-shrink:0;background:var(--gp-l);color:var(--accent)}
.nchip.pri{background:var(--dark);color:#fff}
.nchip.lim{background:#FDF3E3;color:#8A5D12}
.nchip.ask{background:var(--gb-l);color:#26708F}
.nchip.own{background:#F2F2F8;color:var(--muted)}
.narr{color:#C8C8D8;font-size:11px;flex-shrink:0;transition:transform .25s}
.nrow.on .narr{transform:rotate(90deg);color:var(--accent)}
.nbody{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.4,0,.2,1)}
.nrow.on .nbody{max-height:190px}
.nbody div{padding:0 10px 15px 46px;font-size:12px;line-height:1.65;color:var(--muted)}
.nbody b{color:var(--text);font-weight:600}
.nwhere{display:inline-block;margin-top:8px;font-family:'DM Mono';font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:var(--gp-l);padding:4px 9px;border-radius:5px}

/* ═════════ DORES / NECESSIDADES EM QUADROS ═════════ */
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:1040px;margin-top:22px}
.qbox{border:1px solid var(--border);border-radius:12px;background:#fff;padding:15px 14px 14px;
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;min-height:172px;cursor:pointer;
  transition:transform .26s cubic-bezier(.2,.7,.3,1),box-shadow .26s,border-color .26s}
.qbox:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(26,26,46,.10);border-color:transparent}
.qbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.qbox.mut::before{background:#E4E4EE}
.qt{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.32;letter-spacing:-.015em}
.qn0{font-family:'DM Mono';font-size:10px;letter-spacing:.13em;color:#C4C4D6}
.qbox:hover .qn0{color:var(--accent)}
.qp{font-size:11px;color:var(--muted);line-height:1.5}
.qc{font-family:'DM Mono';font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
  border-radius:5px;align-self:flex-start;background:var(--gp-l);color:var(--accent)}
.qc.pri{background:var(--dark);color:#fff}
.qc.lim{background:#FDF3E3;color:#8A5D12}
.qc.rsk{background:var(--gb-l);color:#26708F}
.qc.own{background:#F2F2F8;color:var(--muted)}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.qmore{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:flex;
  align-items:center;justify-content:center;font-size:11px;color:#B8B8CC;flex-shrink:0;transition:.24s}
.qbox:hover .qmore{background:var(--dark);border-color:transparent;color:#fff}
@media(max-width:1100px){.qgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.qgrid{grid-template-columns:1fr 1fr}}
#qov{position:fixed;inset:0;z-index:380;background:rgba(20,20,34,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .26s}
#qov.on{opacity:1;pointer-events:auto}
#qcard{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:27px 30px 25px;position:relative;
  box-shadow:0 30px 80px rgba(20,20,34,.42);transform:translateY(12px) scale(.985);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);max-height:100%;overflow:auto}
#qov.on #qcard{transform:none}
#qcard .qx{position:absolute;top:15px;right:16px;width:28px;height:28px;border:0;border-radius:8px;
  background:#F4F4F9;color:var(--muted);font-size:13px;cursor:pointer;transition:.2s}
#qcard .qx:hover{background:var(--dark);color:#fff}
#qcard h3{margin:9px 0 0;font-size:21px;font-weight:600;color:var(--text);letter-spacing:-.02em;line-height:1.24;padding-right:34px}
#qcard .qnum{font-family:'DM Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:9px}
#qcard .qd{margin-top:11px;font-size:13.5px;color:var(--text);line-height:1.6}
#qcard .qn{margin-top:12px;padding-top:13px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.68}
#qcard .qn b{color:var(--text);font-weight:600}
#qcard .qw{display:inline-block;margin-top:13px;font-family:'DM Mono';font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);background:var(--gp-l);padding:5px 10px;border-radius:6px}

/* ═════════ VISTA: PIPELINE ═════════ */
.plhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.plsub{font-size:11.5px;color:var(--muted);line-height:1.4}
.plsub b{color:var(--text);font-weight:600}
.plrun{background:var(--dark);color:#fff;border:0;border-radius:9px;padding:8px 15px;cursor:pointer;
  font-family:'DM Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;transition:transform .2s,opacity .2s}
.plrun:hover{transform:translateY(-1px)}
.plrun:disabled{opacity:.45;cursor:default;transform:none}
.plrail{display:flex;position:relative;margin:14px 0 13px;flex-shrink:0}
.plrail::before{content:'';position:absolute;top:17px;left:8%;right:8%;height:2px;background:var(--border)}
.plfill{position:absolute;top:17px;left:8%;height:2px;background:var(--grad);width:0;transition:width .55s cubic-bezier(.4,0,.2,1);border-radius:2px}
.plnode{flex:1;text-align:center;cursor:pointer;position:relative;z-index:1;min-width:0}
.plnode .pldot{width:36px;height:36px;border-radius:12px;background:#fff;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:14px;color:var(--muted);transition:.32s cubic-bezier(.2,.7,.3,1)}
.plnode.done .pldot{border-color:transparent;background:var(--gg-l);color:#1E7F52}
.plnode.on .pldot{border-color:transparent;background:var(--dark);color:#fff;transform:scale(1.1);box-shadow:0 8px 20px rgba(26,26,46,.26)}
.plnode .pll{font-size:10px;line-height:1.3;color:var(--muted);padding:0 5px;display:block;overflow:hidden;text-overflow:ellipsis}
.plnode.on .pll{color:var(--text);font-weight:600}
.plnode .plk{display:block;font-family:'DM Mono';font-size:8.5px;letter-spacing:.1em;color:#B9B9CC;margin-bottom:2px}
.plnode.on .plk{color:var(--accent)}
.pldet{flex:1;min-height:0;border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:11px}
.pld-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pld-t{font-size:14.5px;font-weight:600;color:var(--text);letter-spacing:-.01em;line-height:1.3}
.pld-tag{font-family:'DM Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;flex-shrink:0;background:var(--gp-l);color:var(--accent)}
.pld-tag.key{background:var(--dark);color:#fff}
.pld-m{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px}
.pld-m > div{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);border-bottom:1px dashed var(--border);padding-bottom:5px}
.pld-m b{font-weight:500;color:var(--text);font-family:'DM Mono';font-size:10.5px;text-align:right}
.pld-n{font-size:12px;color:var(--muted);line-height:1.6}
.pld-n b{color:var(--text);font-weight:600}

/* ═════════ VISTA: MAIL (rascunho da IA + raciocínio) ═════════ */
.mlwrap{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;flex:1;min-height:0}
.mlcard{border:1px solid var(--border);border-radius:12px;background:#fff;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mlhead{padding:11px 14px 12px;border-bottom:1px solid var(--border);background:#FBFBFD;flex-shrink:0}
.mlrow{display:flex;gap:9px;font-size:11.5px;color:var(--text);margin-bottom:3px;align-items:baseline}
.mlrow i{font-style:normal;color:#B0B0C4;width:36px;flex-shrink:0;font-family:'DM Mono';font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.mlsub{font-size:13px;font-weight:600;color:var(--text);margin-top:7px;letter-spacing:-.01em}
.mlbody{padding:14px 16px;overflow:auto;font-size:12px;line-height:1.7;color:var(--text);flex:1;min-height:0}
.mlbody p{margin:0 0 10px}
.mlbody p:last-child{margin:0}
.mlbody[contenteditable="true"]{outline:2px solid var(--gb);outline-offset:-2px;background:#FCFDFF}
.mlfoot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;background:#FBFBFD}
.mlbtn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:11.5px;font-weight:500;transition:.2s;font-family:inherit}
.mlbtn:hover{border-color:var(--accent);color:var(--accent)}
.mlbtn.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.mlbtn.pri:hover{color:#fff;transform:translateY(-1px)}
.mlsent{font-family:'DM Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#1E7F52}
.mlwhy{border:1px solid var(--border);border-radius:12px;background:#fff;padding:13px 15px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:9px}
.mlwhy h5{margin:0;font-family:'DM Mono';font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.mlwi{font-size:11.5px;line-height:1.55;color:var(--muted);padding-left:13px;position:relative}
.mlwi::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--gb)}
.mlwi b{color:var(--text);font-weight:600}
.mlflag{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;font-size:11px;line-height:1.55;color:var(--text)}
.mlflag span{font-family:'DM Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8A5D12;background:#FDF3E3;padding:3px 8px;border-radius:5px;display:inline-block;margin-bottom:6px}

/* ═════════ VISTA: TREE (árvore de destino) ═════════ */
.trwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;flex:1;min-height:0}
.trbox{border:1px solid var(--border);border-radius:12px;background:#fff;padding:9px 7px;overflow:auto;min-height:0}
.trn{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;cursor:pointer;font-family:'DM Mono';font-size:11px;color:var(--text);transition:background .2s,color .2s}
.trn:hover{background:#F6F6FB}
.trn .trc{width:9px;flex-shrink:0;color:#C4C4D6;font-size:9px;transition:transform .25s}
.trn.open > .trc{transform:rotate(90deg)}
.trn .tri{flex-shrink:0;opacity:.75;font-size:11px}
.trn .trl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trn .trb{margin-left:auto;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#F2F2F8;color:var(--muted);flex-shrink:0}
.trn.hit{background:var(--gg-l)}
.trn.hit .trl{color:#1E7F52;font-weight:600}
.trn.hit .trb{background:var(--ok);color:#fff}
.trn.flag{background:#FDF3E3}
.trn.flag .trl{color:#8A5D12}
.trn.flag .trb{background:var(--warn);color:#fff}
.trside{border:1px solid var(--border);border-radius:12px;background:#fff;padding:13px 15px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.trside h5{margin:0;font-family:'DM Mono';font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.trside .trt{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.trside .trp{font-family:'DM Mono';font-size:10px;color:var(--muted);background:#F7F7FB;border-radius:7px;padding:8px 10px;line-height:1.5;word-break:break-all}
.trside .trd{font-size:11.5px;color:var(--muted);line-height:1.6}
.trside .trd b{color:var(--text);font-weight:600}
.trchips{display:flex;flex-wrap:wrap;gap:6px}
.trchip{font-family:'DM Mono';font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--gb-l);color:#26708F;cursor:pointer;transition:.2s}
.trchip:hover{background:var(--gb);color:#fff}
.trchip.on{background:var(--dark);color:#fff}

@media print{
  @page{size:1280px 720px;margin:0}
  body{overflow:visible!important;height:auto!important;background-image:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grid-light,.gbar,.ftr{display:none!important}
  .deck{padding-top:0!important;height:auto!important}
  .slide{position:relative!important;inset:auto!important;opacity:1!important;pointer-events:auto!important;width:1280px!important;height:720px!important;page-break-after:always!important;padding:36px 56px 46px!important}
  .slide:last-child{page-break-after:avoid!important}
}
@media (max-width:960px){.pgrid{grid-template-columns:1fr!important}.mgrid,.kpis,.kb{grid-template-columns:1fr 1fr}.drow{grid-template-columns:1fr}.appside{display:none}}
/* ═══ SLIDES ADICIONAIS · "Porquê a GM Flow" (tokens já existentes, sem novos) ═══ */
/* ── SLIDE 1 · lista interrogativa ── */
.qlist{width:100%;max-width:880px;margin-top:16px;border-top:1px solid var(--border)}
.qrow{border-bottom:1px solid var(--border);padding:14px 6px;cursor:pointer;
  transition:opacity .35s ease,background .2s ease}
.qrow:hover{background:rgba(124,90,224,.028)}
.qlist.has-open .qrow{opacity:.4}
.qlist.has-open .qrow.on{opacity:1}
.qr-head{display:flex;align-items:flex-start;gap:14px}
.qr-n{font-family:'DM Mono';font-size:10px;letter-spacing:.15em;color:var(--accent);flex-shrink:0;padding-top:7px}
.qr-body{flex:1;min-width:0}
.qr-q{font-family:'Playfair Display',serif;font-size:clamp(17px,1.75vw,22px);font-weight:600;
  color:var(--dark);line-height:1.25;margin-bottom:3px}
.qr-a{font-size:13.5px;color:var(--muted);font-weight:300;line-height:1.5}
.qr-more{font-family:'DM Mono';font-size:9.5px;letter-spacing:.1em;color:var(--accent);
  flex-shrink:0;opacity:.6;transition:opacity .2s;padding-top:8px;white-space:nowrap}
.qr-more::after{content:'ver detalhe →'}
.qrow:hover .qr-more{opacity:1}
.qrow.on .qr-more{opacity:1}
.qrow.on .qr-more::after{content:'fechar ×'}
.qr-exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.2,.8,.2,1)}
.qrow.on .qr-exp{grid-template-rows:1fr}
.qr-expi{overflow:hidden;min-height:0}
.qr-d{font-size:12.5px;color:var(--text);line-height:1.6;font-weight:300;margin-top:10px;max-width:640px}
.qr-pts{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin-top:9px;padding-bottom:3px}
.qr-pts li{font-size:11.5px;color:var(--muted);line-height:1.45;padding-left:15px;position:relative}
.qr-pts li::before{content:'✓';position:absolute;left:0;top:0;color:var(--ok);font-size:10px}
/* ── SLIDE 2 · split assimétrico de prova ── */
.pfgrid{display:grid;grid-template-columns:40fr 60fr;gap:0;width:100%;max-width:1040px;
  margin-top:12px;align-items:start}
.pf-left{padding-right:30px}
.pf-right{padding-left:30px;border-left:1px solid var(--border)}
.pf-name{display:block;font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--dark);line-height:1.2}
.pf-role{display:block;font-size:12px;color:var(--muted);font-weight:300;margin-top:2px}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.pf-chip{font-family:'DM Mono';font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent);background:var(--gp-l);border-radius:12px;padding:4px 9px;line-height:1.35}
.pf-text{font-size:12.5px;color:var(--text);line-height:1.6;font-weight:300;margin-top:13px}
.pf-stats{display:flex;gap:26px;margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}
.pf-sv{display:block;font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.pf-sl{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px;max-width:130px}
.pf-foot{font-size:11.5px;color:var(--muted);line-height:1.55;font-weight:300;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--border)}
.pf-rt{font-family:'Playfair Display',serif;font-size:clamp(18px,2vw,24px);font-weight:600;
  color:var(--dark);line-height:1.25}
.pf-rs{font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.55;margin-top:5px}
.pf-log{margin-top:14px;position:relative}
.pf-li{display:flex;align-items:flex-start;gap:12px;padding:7px 0;position:relative}
.pf-li::before{content:'';position:absolute;left:9px;top:24px;bottom:-7px;width:1px;background:var(--border)}
.pf-li:last-child::before{display:none}
.pf-ln{width:19px;height:19px;border-radius:50%;background:var(--grad);color:#fff;
  font-family:'DM Mono';font-size:8.5px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;position:relative;z-index:1}
.pf-lc{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 9px}
.pf-lt{font-size:13px;font-weight:600;color:var(--dark);line-height:1.35}
.pf-ld{font-size:11.5px;color:var(--muted);font-weight:300;line-height:1.4;flex:1;min-width:150px}
.pf-close{margin-top:14px;padding:12px 16px;border-left:3px solid var(--accent);
  background:var(--gp-l);border-radius:0 10px 10px 0;font-size:12px;color:var(--text);
  line-height:1.6;font-weight:300}
@media (max-width:1100px){
  .pf-left{padding-right:22px}.pf-right{padding-left:22px}
  .pf-stats{gap:18px}.pf-sv{font-size:26px}
}
/* ecrãs mais estreitos ou baixos: comprimir sem colapsar o split */
@media (max-width:1100px),(max-height:780px){
  .pfgrid{margin-top:8px}
  .pf-name{font-size:17.5px}
  .pf-chips{margin-top:9px}
  .pf-chip{padding:3px 8px}
  .pf-text{font-size:12px;margin-top:10px;line-height:1.55}
  .pf-stats{margin-top:11px;padding-top:11px}
  .pf-sl{font-size:10.5px}
  .pf-foot{margin-top:10px;padding-top:10px;font-size:11px}
  .pf-rs{font-size:12px}
  .pf-log{margin-top:10px}
  .pf-li{padding:5px 0}
  .pf-lt{font-size:12.5px}
  .pf-close{margin-top:11px;padding:10px 14px;font-size:11.5px;line-height:1.55}
  .qlist{margin-top:12px}
  .qrow{padding:12px 6px}
}
@media (max-width:860px){
  .pfgrid{grid-template-columns:1fr;gap:18px}
  .pf-left{padding-right:0}
  .pf-right{padding-left:0;border-left:none;border-top:1px solid var(--border);padding-top:16px}
  .qr-pts{grid-template-columns:1fr}
  .qr-more{display:none}
}

</style>

<script>
/* ══════════════════════════════════════════════════════════════════
  CATÁLOGO DE BLOCOS (todos OPCIONAIS)

  {type:'cover',   eyebrow,titleHtml,sub,meta:[]}
  {type:'ask',     label,titleHtml,sub,items:[{n,h,p,quote}]}     // O QUE NOS PEDIRAM
  {type:'problems',label,titleHtml,cards:[{accent:'pp|pb|pg',n,h,p}]}
  {type:'app',     label,titleHtml,sub,hint,app:{...}}            // ★ DEMO DE WEBAPP
  {type:'cards',   label,titleHtml,cards:[{ico,n,tag,t,d,long,bullets:[]}]}
  {type:'guarantees', label,titleHtml,cards:[{ico,t,p}]}   // ★ OBRIGATÓRIO em todos os decks
  {type:'price',   mode:'single'|'phased',...}
  {type:'steps',   label,titleHtml,steps:[{n,h,p}],contact:{title,text,name,email},validity}
  {type:'qlist',   label,titleHtml,intro,rows:[{n,q,a,detail,points:[]}]}
                   // ★ PORQUÊ A GM FLOW (1/2) — três perguntas; a linha aberta expande e as
                   //   outras esbatem. Conteúdo FIXO institucional; entra antes do preço.
  {type:'proof',   label,titleHtml,left:{name,role,chips:[],text,stats:[{v,l}],foot},
                   right:{title,sub,log:[{t,d}],close}}
                   // ★ PORQUÊ A GM FLOW (2/2) — split assimétrico: pessoa + prova à esquerda,
                   //   registo numerado do que já foi automatizado à direita. Vem logo a seguir ao qlist.
  {type:'cases',   label,titleHtml,sub,cases:[{key,n,t,p,tags:[],html|b64|url}]}
                   // ★ CASOS DE ESTUDO — pré-visualização em iframe + abertura em ecrã inteiro
                   //   PERGUNTA SEMPRE ao utilizador antes de incluir este bloco
  {type:'needs',   label,titleHtml,sub,needs:[{t,p,chip,cls:'pri|lim|ask|own',note,where}]}
                   // ★ A LISTA DELES — linhas expansíveis. cls 'lim' marca os LIMITES que impuseram
  {type:'pains',   label,titleHtml,sub,items:[{t,chip,cls,p,note,where,numLabel}]}
                   // ★ quadros só com título; a descrição abre em pop-up ao clicar
                   // ★ OBRIGATÓRIO · contact é SEMPRE Guilherme Gomes · guilhermegomes@gmflow.pt

  app:{ url,name,sub, nav:[{ico,label,view,badge}], views:{ id:VIEW } }
    VIEW.kind (8 tipos — usa PELO MENOS 4 diferentes por deck):
     'dashboard' períodos + KPIs/barras/feed clicáveis com drill-down
                 {ranges:[{k,label,sub}], chart:{title,unit}, data:{<k>:{kpis:[{v,l,d,dir,breakdown}],
                  bars:[{l,v,breakdown}]}}, feed:{title,items:[{color,txt,time,title,breakdown}]}}
     'table'     filtros + pesquisa + drawer com AÇÕES QUE MUDAM O ESTADO
                 {filters:[{k,label}], columns:[], rows:[{k,cells:[],status:{cls,label},
                  detail:{title,meta,note,actions:[{label,ico,toast,to:{cls,label}}]}}]}
                 → `to` muda mesmo o estado da linha e atualiza os contadores; `toast` notifica
     'kanban'    cartões com DRAG & DROP real entre colunas {columns:[{title,cards:[{t,s}]}],hint}
     'chat'      assistente {avatar,greeting,starters:[{q,a}],fallback}
     'upload'    arrastar documento → OCR preenche campos AO VIVO
                 {icon,title,sub,panelTitle,action,files:[{ico,name,conf,values:[]}],fields:[{k}]}
     'flow'      diagrama de nós clicáveis + execução animada ponta a ponta
                 {hintTitle,hint,done,nodes:[{ico,t,s,detail}]}
     'config'    configurador com sliders/toggles e recálculo em TEMPO REAL
                 {outLabel,outSub,togglesLabel,sliders:[{label,value,min,max,step,unit}],
                  toggles:[{label,on}], compute:function(valores,ligados){return {value,lines:[{k,v}]}}}
     'calendar'  agenda com slots livres/ocupados, escolha e confirmação
                 {title,sub,hint,booked,days:[{d,date,slots:[{h,label,busy,note}]}]}
     'pipeline'  máquina de estados percorrível — clica em cada fase ou corre o ciclo todo.
                 Ideal para marcar o que é NOSSO e o que fica com a EQUIPA DELES (detail.key)
                 {sub,runLabel,stages:[{ico,t,detail:{title,tag,key,meta:[{k,v}],note}}]}
     'mail'      rascunho escrito pela IA + o raciocínio ao lado; aprovar / editar / rejeitar

          sim:{ kind:"config", outLabel:"Horas devolvidas à equipa técnica", outSub:"por campanha, só em trabalho documental",
            togglesLabel:"Automatizar também",
            sliders:[
              {label:"Processos de certificação por campanha",value:600,min:100,max:3000,step:10},
              {label:"Evidências por processo",value:24,min:5,max:120,step:1},
              {label:"Minutos por evidência na conferência (hoje)",value:7,min:1,max:30,step:1,unit:" min"}
            ],
            toggles:[{label:"Pré-validação documental",on:true},{label:"Constatações e prazos",on:false},{label:"Emissão do certificado",on:false}],
            compute:function(v,on){
              const proc=v[0],ev=v[1],min=v[2];
              const horas=proc*ev*min/60;
              let a=0.55;
              if(on[0])a+=0.10; if(on[1])a+=0.07; if(on[2])a+=0.05;
              a=Math.min(a,0.78);
              const lib=horas*a;
              const fmt=function(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
              return { value:fmt(lib)+"h",
                lines:[
                  {k:"Conferência documental hoje",v:fmt(horas)+"h / campanha"},
                  {k:"Trabalho repetitivo automatizado",v:Math.round(a*100)+"%"},
                  {k:"Fica para julgamento humano",v:fmt(horas-lib)+"h / campanha"},
                  {k:"Equivalente a",v:String(Math.round(lib/1600*10)/10).replace('.',',')+" pessoas a tempo inteiro"},
                  {k:"Decisões de certificação tomadas por pessoa",v:"100%"}
                ]};
            } }
        }
      } },

/* Dashboard INTERATIVO: período troca KPIs+gráfico · KPIs clicáveis · barras clicáveis · feed clicável */
function dashKey(id,vid){return id+'-'+vid;}
function viewDashboard(v,id,vid){
  const k=dashKey(id,vid);DASH[k]={cfg:v,range:v.ranges[0].k,sel:null};
  const segs=v.ranges.map((r,i)=>`<button class="${i===0?'on':''}" onclick="dashRange('${k}','${r.k}',this)">${r.label}</button>`).join('');
  const feed=v.feed?v.feed.items.map((f,i)=>`<div class="fitem" onclick="dashFeed('${k}',${i})"><span class="fdot" style="background:${f.color}"></span><span class="ftxt">${f.txt}</span><span class="ftime">${f.time}</span></div>`).join(''):'';
  return `<div class="vpane" data-view="${vid}">
    <div class="segrow"><div class="seg">${segs}</div><span class="seghint">${v.hint||'clica nos indicadores e nas barras'}</span></div>
    <div class="kpis" id="dk-${k}"></div>
    <div class="dstrip" id="ds-${k}"></div>
    <div class="drow">
      <div class="card"><div class="card-h"><span class="card-t">${v.chart.title}</span><span class="card-s" id="dcs-${k}"></span></div>
        <div style="position:relative"><div class="gridline" style="top:14px"></div><div class="gridline" style="top:63px"></div>
        <div class="bars" id="db-${k}"></div></div><div class="blabels" id="dl-${k}"></div></div>
      ${v.feed?`<div class="card"><div class="card-h"><span class="card-t">${v.feed.title}</span></div><div class="feed">${feed}</div></div>`:''}
    </div></div>`;
}
function dashRender(k,animateBars){
  const st=DASH[k],v=st.cfg,d=v.data[st.range],rg=v.ranges.find(r=>r.k===st.range);
  document.getElementById('dk-'+k).innerHTML=d.kpis.map((x,i)=>
    `<div class="kpi" onclick="dashKpi('${k}',${i},this)"><div class="kpi-l">${x.l}</div><div class="kpi-v" data-count="${x.v}">${x.v}</div><div class="kpi-d ${x.dir||'flat'}">${x.d||''}</div></div>`).join('');
  const max=Math.max(...d.bars.map(b=>b.v));
  document.getElementById('db-'+k).innerHTML=d.bars.map((b,i)=>
    `<div class="barwrap" onclick="dashBar('${k}',${i},this)"><div class="btip">${b.v} ${v.chart.unit||''}</div><div class="bar" data-h="${Math.round(b.v/max*100)}"></div></div>`).join('');
  document.getElementById('dl-'+k).innerHTML=d.bars.map(b=>`<span>${b.l}</span>`).join('');
  const cs=document.getElementById('dcs-'+k);if(cs)cs.textContent=rg?rg.sub||rg.label:'';
  const strip=document.getElementById('ds-'+k);if(strip){strip.classList.remove('on');}
  st.sel=null;
  const pane=document.getElementById('dk-'+k).closest('.vpane');
  if(animateBars!==false)animate(pane);
}
function dashRange(k,rk,btn){
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  DASH[k].range=rk;dashRender(k);
}
function dashStrip(k,title,items){
  const s=document.getElementById('ds-'+k);
  s.innerHTML=`<span class="dst-x" onclick="document.getElementById('ds-${k}').classList.remove('on')">✕</span>
    <div class="dst-t">${title}</div><div class="dst-b">${items.map(i=>`<span class="dst-i">${i}</span>`).join('')}</div>`;
  s.classList.add('on');
}
function dashKpi(k,i,el){
  const st=DASH[k],x=st.cfg.data[st.range].kpis[i];
  el.parentNode.querySelectorAll('.kpi').forEach(n=>n.classList.remove('sel'));el.classList.add('sel');
  dashStrip(k,x.l+' · '+x.v,(x.breakdown||['Sem detalhe adicional.']));
}
function dashBar(k,i,el){
  const st=DASH[k],b=st.cfg.data[st.range].bars[i];
  el.parentNode.querySelectorAll('.barwrap').forEach(n=>n.classList.remove('sel'));el.classList.add('sel');
  dashStrip(k,(st.cfg.chart.title)+' · '+b.l+' — '+b.v+' '+(st.cfg.chart.unit||''),(b.breakdown||['Sem detalhe adicional.']));
}
function dashFeed(k,i){
  const f=DASH[k].cfg.feed.items[i];
  dashStrip(k,(f.title||f.txt.replace(/<[^>]+>/g,'')),(f.breakdown||['Sem detalhe adicional.']));
}
function viewTable(v,id,vid){
  const filters=(v.filters||[]).map((f,i)=>`<button class="tf${i===0?' on':''}" onclick="tFilter('${id}','${vid}',this,'${f.k}')">${f.label}</button>`).join('');
  const cols=v.columns.map(c=>`<th>${c}</th>`).join('');
  const rows=v.rows.map((r,ri)=>{
    const cells=r.cells.map((c,ci)=>{
      if(c===''&&r.status)return `<td><span class="pill ${r.status.cls}"><i></i>${r.status.label}</span></td>`;
      return `<td${ci===r.cells.length-1?' style="text-align:right;font-family:DM Mono;font-size:11.5px"':''}>${c}</td>`;
    }).join('');
    return `<tr data-k="${r.k}" data-ri="${ri}" onclick="openDrawer('${id}','${vid}',${ri})">${cells}</tr>`;
  }).join('');
  return `<div class="vpane" data-view="${vid}">
    <div class="tfilters">${filters}<span class="tcount" id="tc-${id}-${vid}"></span></div>
    <table class="ttable"><thead><tr>${cols}</tr></thead><tbody id="tb-${id}-${vid}">${rows}</tbody></table>
    <div class="drawer" id="dr-${id}-${vid}">
      <div class="dhead"><h4 id="drt-${id}-${vid}"></h4><button class="dclose" onclick="closeDrawer('${id}','${vid}')">✕</button></div>
      <div class="dbody"><div class="dmeta" id="drm-${id}-${vid}"></div><div class="dnote" id="drn-${id}-${vid}"></div><div class="dacts" id="dra-${id}-${vid}"></div></div>
    </div></div>`;
}

      ondragleave="this.style.background=''"
      ondrop="kbDrop(event,this,'${id}','${vid}')">

let _dragCard=null;
function kbDragStart(e,card){_dragCard=card;card.style.opacity='.45';setTimeout(()=>card.style.opacity='',400);}
function kbDrop(e,col,id,vid){
  e.preventDefault();col.style.background='';
  if(!_dragCard)return;
  col.querySelector('.kbcards').appendChild(_dragCard);
  kbCount(id,vid);
  toast(id,'↦','<b>'+_dragCard.querySelector('.kbc-t').textContent+'</b> → '+col.querySelector('.kbt').textContent);
  _dragCard=null;
}
function kbCount(id,vid){
  const board=document.getElementById(`kb-${id}-${vid}`);
  board.querySelectorAll('.kbcol').forEach(c=>c.querySelector('[data-n]').textContent=c.querySelectorAll('.kbcard').length);
